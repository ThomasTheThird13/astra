<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Astra <V7 class="4"></V7> · Sistema Guevara</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --bg: #000000;
  --fg: #ffffff;
  --fg2: #cccccc;
  --fg3: #888888;
  --fg4: #444444;
  --card: #080808;
  --border: #1a1a1a;
  --border2: #111111;
  --primary: hsl(0, 82%, 42%);
  --primary-dim: hsl(0, 82%, 42%, 0.15);
  --primary-glow: hsl(0, 82%, 42%, 0.08);
  --secondary: #0f0f0f;
  --dante: #aaaaaa;
  --max-c: #787878;
  --ate: hsl(280, 70%, 50%); /* más oscuro y fuerte */
  --radius: 0px;
  --font-mono: 'JetBrains Mono', monospace;
  --font-serif: 'Libre Baskerville', Georgia, serif;
}

[data-theme="light"] {
  --bg: #ffffff;
  --fg: #0a0a0a;
  --fg2: #222222;
  --fg3: #555555;
  --fg4: #999999;
  --card: #fafafa;
  --border: #e0e0e0;
  --border2: #ececec;
  --primary: hsl(0, 85%, 40%);
  --primary-dim: hsl(0, 85%, 40%, 0.1);
  --primary-glow: hsl(0, 85%, 40%, 0.06);
  --secondary: #f5f5f5;
  --dante: #333333;
  --max-c: #666666;
  --ate: hsl(280, 65%, 35%); /* morado más oscuro en modo claro */
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-serif);
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
}

/* scrollbar */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); }
::-webkit-scrollbar-thumb:hover { background: var(--fg4); }

/* animations */
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
@keyframes scanline { 0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)} }

.fade-in { animation: fadeIn 0.6s ease both; }
.slide-down { animation: slideDown 0.5s cubic-bezier(0.23,1,0.32,1) both; }
.slide-up-anim { animation: slideUp 0.5s cubic-bezier(0.23,1,0.32,1) both; }
.cursor-blink { animation: blink 1s step-end infinite; }

/* progress bar top */
.day-bar {
  position: fixed; top: 0; left: 0; height: 1px; z-index: 100;
  background: var(--primary);
  box-shadow: 0 0 8px var(--primary);
  transition: width 1s linear;
}

/* layout */
.app { display: flex; flex-direction: column; min-height: 100vh; }

/* HEADER */
.header {
  border-bottom: 1px solid var(--border);
  padding: 0;
  position: relative;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.625rem 1.25rem;
  border-bottom: 1px solid var(--border2);
}

.clocks {
  display: flex;
  gap: 1.5rem;
  font-family: var(--font-mono);
  font-size: 0.5rem;
  color: var(--fg4);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.clock-item { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.clock-time { font-size: 0.7rem; color: var(--fg3); letter-spacing: 0.5px; }

.header-controls {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.fecha-display {
  font-family: var(--font-mono);
  font-size: 0.45rem;
  color: var(--fg4);
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* countdowns hero */
.countdowns-zone {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 0;
  padding: 1.75rem 1.25rem 1rem;
  position: relative;
}

.countdown-block {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.25rem;
  padding: 0 1.5rem;
  position: relative;
  cursor: pointer;
  transition: opacity 0.2s;
}
.countdown-block:hover { opacity: 0.8; }
.countdown-block + .countdown-block::before {
  content: '';
  position: absolute;
  left: 0; top: 10%; height: 80%;
  width: 1px;
  background: var(--border);
}

.countdown-number {
  font-family: var(--font-mono);
  font-size: clamp(3.2rem, 6.5vw, 5.8rem);
  font-weight: 700;
  color: var(--fg);
  letter-spacing: -2px;
  line-height: 1;
  transition: color 0.2s;
}
.countdown-number.urgent { color: var(--primary); }
.countdown-number.soon { color: var(--fg2); }

.countdown-label {
  font-family: var(--font-mono);
  font-size: 0.4rem;
  color: var(--fg4);
  letter-spacing: 4px;
  text-transform: uppercase;
}
.countdown-unit {
  font-family: var(--font-mono);
  font-size: 0.38rem;
  color: var(--fg4);
  letter-spacing: 2px;
}

/* dialogue strip */
.dialogue-strip {
  border-top: 1px solid var(--border2);
  padding: 0.5rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  min-height: 2rem;
}

.dia-max {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--max-c);
  font-style: italic;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.dia-dante {
  font-family: var(--font-serif);
  font-size: 0.65rem;
  color: var(--dante);
  font-style: italic;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  text-align: right;
}
.dia-sep {
  width: 1px;
  height: 1rem;
  background: var(--border);
  flex-shrink: 0;
}

/* BODY */
.body-grid {
  display: grid;
  grid-template-columns: 240px 1fr 280px;
  flex: 1;
  border-top: 1px solid var(--border);
  min-height: 0;
}

@media(max-width: 1000px) {
  .body-grid { grid-template-columns: 1fr; }
  .col-left, .col-right { border-right: none; border-bottom: 1px solid var(--border); max-width: 100%; }
}

@media(max-width: 768px) {
  .body-grid { padding: 0.5rem; }
  .col-left, .col-center, .col-right { padding: 0.75rem 0.5rem; }
  .kpi { min-width: 100px; }
  .kpi-val { font-size: 0.9rem; }
  .kpi-lbl { font-size: 0.4rem; }
}

.col-left {
  border-right: 1px solid var(--border);
  padding: 1rem 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  overflow-y: auto;
}

.col-center {
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  overflow-y: auto;
  border-right: 1px solid var(--border);
}

.col-right {
  padding: 1rem 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  overflow-y: auto;
}

/* section label */
.sec-label {
  font-family: var(--font-mono);
  font-size: 0.4rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--fg4);
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.sec-label::after { content:''; flex:1; height:1px; background:var(--border); }

/* button */
.btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--fg3);
  padding: 0.15rem 0.5rem;
  font-family: var(--font-mono);
  font-size: 0.5rem;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn:hover { color: var(--fg); border-color: var(--fg4); }
.btn.active { border-color: var(--primary); color: var(--fg); }
.btn.danger:hover { border-color: var(--primary); color: var(--primary); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* input */
.inp {
  background: var(--secondary);
  border: 1px solid var(--border);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 0.6rem;
  padding: 0.4rem 0.5rem;
  width: 100%;
  outline: none;
  transition: border-color 0.2s;
}
.inp:focus { border-color: var(--primary); }
.inp-serif { font-family: var(--font-serif); font-size: 0.75rem; }
.inp-area { resize: vertical; min-height: 6rem; }

/* modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
}
.modal-box {
  border: 1px solid var(--border);
  background: var(--card);
  padding: 1.5rem;
  width: 380px;
  max-width: 95vw;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  animation: slideDown 0.3s ease both;
}
.modal-title {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--fg2);
}
.modal-row { display:flex; gap:0.5rem; justify-content:flex-end; }

/* tabs */
.tabs-row {
  display: flex;
  gap: 0.2rem;
  flex-wrap: wrap;
}

/* kpi */
.kpi {
  border-left: 2px solid var(--border);
  padding: 0.2rem 0.6rem;
  transition: border-color 0.2s;
  cursor: default;
}
.kpi:hover { border-left-color: var(--primary); }
.kpi-val { display: block; font-family: var(--font-mono); font-size: 1.1rem; font-weight: 300; color: var(--fg); }
.kpi-lbl { font-family: var(--font-mono); font-size: 0.4rem; color: var(--fg4); letter-spacing: 1px; text-transform: uppercase; }

/* horizon row */
.horizon-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 0.15rem 0;
  border-bottom: 1px solid var(--border2);
  transition: all 0.15s;
}
.horizon-row:hover { border-bottom-color: var(--primary); transform: translateX(2px); }

/* dots */
.dot { width: 6px; height: 6px; border-radius: 1px; transition: all 0.2s; }
.dot-active { background: var(--primary); box-shadow: 0 0 4px var(--primary); }
.dot-filled { background: rgba(180,30,30,0.45); }
.dot-empty { background: var(--border); }
.dot-row { display: flex; gap: 2px; flex-wrap: wrap; }

/* diary dot */
.diary-dot {
  width: 1.4rem; height: 1.4rem;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 0.42rem;
  cursor: pointer; transition: all 0.15s;
  border: 1px solid var(--border2); color: var(--fg4);
}
.diary-dot.filled { background: var(--primary-dim); color: var(--fg3); }
.diary-dot.current { border-color: var(--primary); color: var(--fg); background: var(--primary-glow); }
.diary-dot:hover { border-color: var(--fg4); }

/* note card */
.note-card {
  border: 1px solid var(--border);
  padding: 0.5rem;
  cursor: pointer;
  transition: all 0.15s;
}
.note-card:hover { border-color: var(--primary); transform: translateY(-1px); }

/* shortcut */
.shortcut-link {
  text-decoration: none;
  color: var(--fg4);
  font-family: var(--font-mono);
  font-size: 0.45rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 0.1rem 0.4rem;
  border: 1px solid transparent;
  transition: all 0.15s;
}
.shortcut-link:hover { color: var(--fg); border-color: var(--border); }
.shortcut-link.priority { color: var(--fg3); border-color: var(--border2); }
.shortcut-link.priority:hover { border-color: var(--primary); color: var(--fg); }

/* search */
.search-form { display: flex; align-items: center; gap: 0.4rem; }
.search-inp {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--fg);
  font-family: var(--font-serif);
  font-size: 0.65rem;
  padding: 0.3rem 0.6rem;
  width: 10rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-inp::placeholder { color: var(--fg4); opacity: 0.5; }
.search-inp:focus { border-color: var(--primary); }

/* meta bar */
.meta-bar { height: 1px; background: var(--border); position: relative; margin-top: 2px; }
.meta-fill { height: 1px; background: var(--primary); position: absolute; top: 0; left: 0; transition: width 0.8s; }

/* acervo item */
.acervo-item {
  border-left: 1px solid var(--border);
  padding: 0.3rem 0.6rem;
  transition: border-color 0.2s;
}
.acervo-item:hover { border-left-color: var(--primary); }

/* spotify */
.spotify-box {
  border: 1px solid var(--border);
  padding: 0.6rem;
  transition: all 0.2s;
}
.spotify-box:hover { border-color: var(--fg4); }

/* iap panel */
.iap-monitor {
  border: 1px solid var(--border);
  padding: 0.75rem;
  position: relative;
  overflow: hidden;
}
.iap-monitor::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--primary);
  opacity: 0.6;
}
.iap-level-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-family: var(--font-mono);
  font-size: 0.5rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 0.15rem 0.5rem;
  border: 1px solid;
}
.iap-text {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  line-height: 1.7;
  color: var(--fg3);
  margin-top: 0.5rem;
}

/* correspondencia */
.corr-item {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  padding: 0.4rem 0;
  border-bottom: 1px solid var(--border2);
}
.corr-status {
  font-family: var(--font-mono);
  font-size: 0.38rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 0.1rem 0.3rem;
  border: 1px solid;
  white-space: nowrap;
  margin-top: 2px;
}
.status-enviado { color: var(--fg4); border-color: var(--border); }
.status-esperando { color: hsl(45,80%,55%); border-color: hsl(45,80%,55%,0.3); }
.status-respondido { color: hsl(140,50%,50%); border-color: hsl(140,50%,50%,0.3); }
.status-archivado { color: var(--fg4); border-color: var(--border2); opacity: 0.5; }

/* hitos */
.hito-card {
  border: 1px solid var(--border);
  padding: 0.75rem;
  transition: border-color 0.2s;
}
.hito-card:hover { border-color: var(--fg4); }
.hito-progress-bar {
  height: 2px;
  background: var(--border);
  margin-top: 0.5rem;
  position: relative;
}
.hito-progress-fill {
  height: 2px;
  background: var(--primary);
  position: absolute;
  top: 0; left: 0;
  transition: width 0.5s;
}
.hito-step {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  padding: 0.3rem 0;
  border-bottom: 1px solid var(--border2);
}
.hito-check {
  width: 0.75rem; height: 0.75rem;
  border: 1px solid var(--border);
  flex-shrink: 0;
  cursor: pointer;
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
  margin-top: 2px;
}
.hito-check.done { background: var(--primary); border-color: var(--primary); }
.hito-check:hover { border-color: var(--primary); }

/* lectura */
.book-card {
  border: 1px solid var(--border);
  padding: 0.6rem;
  transition: border-color 0.2s;
}
.book-card:hover { border-color: var(--fg4); }
.book-progress {
  height: 2px;
  background: var(--border);
  margin-top: 0.4rem;
}
.book-progress-fill {
  height: 2px;
  background: var(--primary);
  transition: width 0.5s;
}

/* presupuesto */
.budget-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.3rem 0;
  border-bottom: 1px solid var(--border2);
}
.budget-positive { color: hsl(140,50%,50%); }
.budget-negative { color: var(--primary); }

/* footer */
footer {
  border-top: 1px solid var(--border);
  padding: 0.5rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  flex-wrap: wrap;
}

/* backup notice */
.backup-notice {
  position: fixed;
  bottom: 1rem; right: 1rem;
  border: 1px solid var(--primary);
  background: var(--card);
  padding: 0.4rem 0.75rem;
  font-family: var(--font-mono);
  font-size: 0.5rem;
  color: var(--fg);
  z-index: 300;
  animation: fadeIn 0.3s ease both;
}

/* tooltip on countdown edit */
.edit-hint {
  font-family: var(--font-mono);
  font-size: 0.38rem;
  color: var(--fg4);
  letter-spacing: 1px;
  opacity: 0;
  transition: opacity 0.2s;
}
.countdown-block:hover .edit-hint { opacity: 1; }

/* astra hub label */
.hub-label {
  font-family: var(--font-mono);
  font-size: 0.38rem;
  letter-spacing: 6px;
  color: var(--fg4);
  opacity: 0.2;
  text-align: center;
  margin-top: 0.5rem;
}

/* theme toggle */
.theme-toggle {
  background: none;
  border: 1px solid var(--border);
  color: var(--fg4);
  font-family: var(--font-mono);
  font-size: 0.45rem;
  letter-spacing: 1px;
  padding: 0.15rem 0.4rem;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
}
.theme-toggle:hover { color: var(--fg); border-color: var(--fg4); }

select.inp { appearance: none; cursor: pointer; }
</style>
</head>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useContext, createContext } = React;

/* =============================================
   THEME CONTEXT
   ============================================= */
const ThemeCtx = createContext('dark');
const PublicCtx = createContext(false);
function usePublic() { return useContext(PublicCtx); }

/* =============================================
   HARDCODED KEYS (solicitado)
   ============================================= */
const GEMINI_PANEL_KEY = 'AIzaSyDagJFg-28MJQ_u0n-MT_TNiuFvbzN3tp8';
const GEMINI_ATE_KEY = 'AIzaSyAJu91kDcsl_I1ZQ3NN5NOaypY6FeXmR6w';
const GITHUB_TOKEN = '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';

/* =============================================
   LOCAL STORAGE HELPERS
   ============================================= */
const ls = {
  get: (k, def) => { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : def; } catch { return def; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const todayKey = () => new Date().toISOString().split('T')[0];
const weekKeys = () => { const k=[]; const n=new Date(); for(let i=6;i>=0;i--) k.push(new Date(n-i*86400000).toISOString().split('T')[0]); return k; };
const monthKeys = () => { const k=[]; const n=new Date(); for(let i=29;i>=0;i--) k.push(new Date(n-i*86400000).toISOString().split('T')[0]); return k; };

/* =============================================
   GITHUB GIST BACKUP (token hardcoded)
   ============================================= */
const BACKUP_KEYS = [
  'astra_notes','diario_data','contexto_events','tracker_data',
  'pomodoroCount','pomodoroHistory','public_mode','gemini_api_key',
  'iap_cache','hitos_data','lectura_data','presupuesto_data',
  'correspondencia_data','countdown_parciales','countdown_sat',
  'countdown_grad','astra_theme','ate_chat_log','ate_model_file'
];

async function backupToGist(type='manual') {
  const token = GITHUB_TOKEN;
  if (!token) return { ok: false, msg: 'Token GitHub no configurado.' };
  const snapshot = {};
  BACKUP_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v) snapshot[k] = v; });
  const data = { timestamp: new Date().toISOString(), type, version: '7.3', data: snapshot };
  let gistId = ls.get('gist_id', null);
  const url = gistId ? `https://api.github.com/gists/${gistId}` : 'https://api.github.com/gists';
  try {
    const res = await fetch(url, {
      method: gistId ? 'PATCH' : 'POST',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: `Astra V7.3 Backup — ${new Date().toISOString()}`, public: false, files: { 'astra-v7-backup.json': { content: JSON.stringify(data, null, 2) } } })
    });
    const r = await res.json();
    if (!res.ok) {
      if (res.status === 404 && gistId) {
        ls.set('gist_id', null);
        return backupToGist(type);
      }
      throw new Error(r.message || `Error ${res.status}`);
    }
    if (!gistId && r.id) ls.set('gist_id', r.id);
    ls.set('lastBackup', new Date().toISOString());
    return { ok: true, msg: 'Backup guardado en Gist.' };
  } catch(e) { return { ok: false, msg: `Error: ${e.message}` }; }
}

async function restoreFromGist() {
  const token = GITHUB_TOKEN;
  const gistId = ls.get('gist_id', null);
  if (!token || !gistId) return { ok: false, msg: 'Token o Gist ID no encontrado.' };
  try {
    const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers: { Authorization: `token ${token}` } });
    if (!res.ok) throw new Error('No se pudo obtener el gist');
    const gist = await res.json();
    const file = gist.files['astra-v7-backup.json'];
    if (!file) throw new Error('Archivo de backup no encontrado');
    const data = JSON.parse(file.content);
    Object.entries(data.data).forEach(([k, v]) => localStorage.setItem(k, v));
    return { ok: true, msg: 'Restaurado. Recargando...' };
  } catch(e) { return { ok: false, msg: `Error: ${e.message}` }; }
}

class ReminderSystem {
  constructor() {
    this.reminders = [];
    this.callbacks = {};
  }
  on(event, callback) { if (!this.callbacks[event]) this.callbacks[event] = []; this.callbacks[event].push(callback); }
  trigger(event, data) { if (this.callbacks[event]) this.callbacks[event].forEach(cb => cb(data)); }
  schedule(event, delayMs, data) { setTimeout(() => this.trigger(event, data), delayMs); }
}

function playNotification() {
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.frequency.value = 800;
  gain.gain.setValueAtTime(0.3, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
  osc.start(audioContext.currentTime);
  osc.stop(audioContext.currentTime + 0.5);
}

/* =============================================
   SPOTIFY PKCE
   ============================================= */
const SPOTIFY_CLIENT_ID = '5ca64f221b95488e96e94a52e2313451';
const SPOTIFY_REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];
const SPOTIFY_SCOPES = 'user-read-currently-playing user-read-playback-state';

async function pkceChallenge() {
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  const verifier = btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  const enc = new TextEncoder().encode(verifier);
  const hash = await crypto.subtle.digest('SHA-256', enc);
  const challenge = btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  return { verifier, challenge };
}
async function spotifyLogin() {
  const { verifier, challenge } = await pkceChallenge();
  sessionStorage.setItem('spotify_verifier', verifier);
  const params = new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, response_type: 'code', redirect_uri: SPOTIFY_REDIRECT_URI, scope: SPOTIFY_SCOPES, code_challenge_method: 'S256', code_challenge: challenge });
  window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}
async function exchangeCode(code) {
  const verifier = sessionStorage.getItem('spotify_verifier');
  if (!verifier) return null;
  const res = await fetch('https://accounts.spotify.com/api/token', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, grant_type:'authorization_code', code, redirect_uri: SPOTIFY_REDIRECT_URI, code_verifier: verifier }) });
  if (!res.ok) return null;
  const data = await res.json();
  ls.set('spotify_token', data.access_token); ls.set('spotify_refresh', data.refresh_token); ls.set('spotify_exp', Date.now() + data.expires_in * 1000);
  sessionStorage.removeItem('spotify_verifier');
  return data.access_token;
}
async function refreshSpotify() {
  const rt = ls.get('spotify_refresh', null);
  if (!rt) return null;
  const res = await fetch('https://accounts.spotify.com/api/token', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, grant_type:'refresh_token', refresh_token: rt }) });
  if (!res.ok) { ls.set('spotify_token', null); return null; }
  const data = await res.json();
  ls.set('spotify_token', data.access_token); ls.set('spotify_exp', Date.now() + data.expires_in * 1000);
  if (data.refresh_token) ls.set('spotify_refresh', data.refresh_token);
  return data.access_token;
}
async function getValidToken() {
  let token = ls.get('spotify_token', null);
  if (!token) return null;
  if (Date.now() > ls.get('spotify_exp', 0) - 60000) token = await refreshSpotify();
  return token;
}
async function fetchNowPlaying(token) {
  const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', { headers: { Authorization: 'Bearer ' + token } });
  if (res.status === 204 || res.status === 404) return { idle: true };
  if (!res.ok) return null;
  const data = await res.json();
  if (!data || !data.item) return { idle: true };
  return { title: data.item.name, artist: data.item.artists.map(a => a.name).join(', '), album: data.item.album.name, cover: data.item.album.images?.[2]?.url || data.item.album.images?.[0]?.url || null, playing: data.is_playing, progress: data.progress_ms, duration: data.item.duration_ms };
}

function useClocks() {
  const [c, setC] = useState({ bog: '--:--', nyc: '--:--' });
  useEffect(() => {
    const u = () => {
      const n = new Date(), o = { hour:'2-digit', minute:'2-digit', hour12: false };
      setC({ bog: n.toLocaleTimeString('es-CO', { ...o, timeZone:'America/Bogota' }), nyc: n.toLocaleTimeString('en-US', { ...o, timeZone:'America/New_York' }) });
    };
    u(); const id = setInterval(u, 1000); return () => clearInterval(id);
  }, []);
  return c;
}

function useDayProgress() {
  const [p, setP] = useState(0);
  useEffect(() => {
    const u = () => { const n = new Date(); setP((n.getHours() * 60 + n.getMinutes()) / 1440 * 100); };
    u(); const id = setInterval(u, 30000); return () => clearInterval(id);
  }, []);
  return p;
}

function usePomodoro() {
  const [time, setTime] = useState(25 * 60);
  const [isWork, setIsWork] = useState(true);
  const [running, setRunning] = useState(false);
  const [count, setCount] = useState(() => parseInt(ls.get('pomodoroCount', '0')));
  const [weekly, setWeekly] = useState(0);
  const [monthly, setMonthly] = useState(0);
  const updateStats = useCallback(() => {
    const h = ls.get('pomodoroHistory', []);
    const n = new Date();
    setWeekly(h.filter(d => new Date(d) >= new Date(n - 7 * 86400000)).length);
    setMonthly(h.filter(d => new Date(d) >= new Date(n - 30 * 86400000)).length);
  }, []);
  useEffect(() => { updateStats(); }, []);
  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => {
      setTime(p => {
        if (p <= 1) {
          setRunning(false);
          playNotification();
          reminderSys.trigger('pomodoro:complete', { isWork, count });
          if (isWork) {
            const nc = count + 1; setCount(nc); ls.set('pomodoroCount', String(nc));
            const h = ls.get('pomodoroHistory', []); h.push(new Date().toDateString()); ls.set('pomodoroHistory', h);
            updateStats(); setIsWork(false); return 5 * 60;
          } else { setIsWork(true); return 25 * 60; }
        }
        return p - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [running, isWork, count]);
  const m = Math.floor(time / 60), s = time % 60;
  return { display: `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`, count, weekly, monthly, isWork, running, start: () => setRunning(true), pause: () => setRunning(false), reset: () => { setRunning(false); setIsWork(true); setTime(25 * 60); } };
}

function useCountdowns() {
  const [days, setDays] = useState({});
  useEffect(() => {
    const u = () => {
      const n = new Date();
      const sat = ls.get('countdown_sat', '2026-08-22');
      const parciales = ls.get('countdown_parciales', '');
      const grad = ls.get('countdown_grad', '2027-11-01');

      setDays({ sat: calc(sat), parciales: parciales ? calc(parciales) : null, grad: calc(grad) });

}

function useGeoWeather() {
  const [loc, setLoc] = useState('⌖ Mosquera');
  const [weather, setWeather] = useState('');
  useEffect(() => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(async pos => {
      const { latitude: lat, longitude: lon } = pos.coords;
      try { const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=es`); const d = await r.json(); setLoc(`⌖ ${d.locality || d.city || 'Región'}`); } catch {}
      try { const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`); const d = await r.json(); const t = Math.round(d.current.temperature_2m); const cs = ['Despejado','Parcialmente nublado','Niebla','Llovizna','Lluvia','Nieve','Aguacero','Nieve fuerte','Tormenta','Variable']; setWeather(`${t}°C · ${cs[Math.min(9, d.current.weather_code)]}`); } catch {}
    }, () => setLoc('⌖ Mosquera'));
  }, []);
  return { loc, weather };
}

   IAP MOMENTUM ALGORITHM
   ============================================= */
const IAP_LEVELS = {
  A: { label:'A — Momentum óptimo', color:'#2f855a', tone:'Sistema operando en verde.' },
  B: { label:'B — Progreso estable', color:'#38a169', tone:'Ritmo sostenido.' },
  C: { label:'C — Operación normal', color:'#d69e2e', tone:'Sin alertas activas.' },
  D: { label:'D — Atención elevada', color:'#dd6b20', tone:'Monitoreo reforzado.' },
  E: { label:'E — Pérdida de tracción', color:'#c05621', tone:'Intervención recomendada.' },
  F: { label:'F — Alerta crítica', color:'#b83257', tone:'Priorización inmediata.' },
  G: { label:'G — Crisis operacional', color:'#9b2c2c', tone:'Modo contención.' },
};

function calcMomentumLevel() {
  let score = 0; // 0-100, menor = peor
  const today = todayKey();
  const week = weekKeys();
  const month = monthKeys();
  const tracker = ls.get('tracker_data', {});
  const pomCount = parseInt(ls.get('pomodoroCount', '0'));
  const pomHistory = ls.get('pomodoroHistory', []);
  const diario = ls.get('diario_data', {});

  // 1. Racha activa (0-30 pts)
  let streak = 0;
  for (let i = month.length - 1; i >= 0; i--) {
    if (tracker[month[i]] && Object.values(tracker[month[i]]).some(v => v > 0)) streak++;
    else if (streak > 0) break;
  }
  score += Math.min(30, streak * 3);

  // 2. Horas esta semana vs semana anterior (0-25 pts)
  const prevWeek = [];
  const n = new Date();
  for (let i = 13; i >= 7; i--) prevWeek.push(new Date(n - i * 86400000).toISOString().split('T')[0]);
  const horasThis = week.reduce((t, k) => t + (tracker[k] ? Object.values(tracker[k]).reduce((a,b) => a+b, 0) : 0), 0);
  const horasPrev = prevWeek.reduce((t, k) => t + (tracker[k] ? Object.values(tracker[k]).reduce((a,b) => a+b, 0) : 0), 0);
  if (horasThis > 0) {
    const ratio = horasPrev > 0 ? horasThis / horasPrev : 1;
    score += Math.min(25, ratio * 15);
  }

  // 3. Diario reciente (0-20 pts)
  const diasDesdeDiario = (() => {
    const keys = Object.keys(diario).filter(k => diario[k] && diario[k].trim()).sort().reverse();
    if (!keys.length) return 30;
    return Math.ceil((new Date(today) - new Date(keys[0])) / 86400000);
  })();
  score += Math.max(0, 20 - diasDesdeDiario * 4);

  // 4. Pomodoros hoy (0-15 pts)
  const pomToday = pomHistory.filter(d => d === new Date().toDateString()).length;
  score += Math.min(15, pomToday * 3);

  // 5. Proximidad SAT (penalización si cerca y horas bajas)
  const satDate = ls.get('countdown_sat', '2026-08-22');
  const diasSAT = Math.ceil((new Date(satDate) - new Date()) / 86400000);
  if (diasSAT < 90 && horasThis < 5) score -= 15;
  if (diasSAT < 30 && horasThis < 10) score -= 20;

  score = Math.max(0, Math.min(100, score));

  if (score >= 80) return 'A';
  if (score >= 65) return 'B';
  if (score >= 50) return 'C';
  if (score >= 38) return 'D';
  if (score >= 25) return 'E';
  if (score >= 12) return 'F';
  return 'G';
}

function buildIAPContext() {
  const week = weekKeys();
  const month = monthKeys();
  const tracker = ls.get('tracker_data', {});
  const pomHistory = ls.get('pomodoroHistory', []);
  const diario = ls.get('diario_data', {});
  const eventos = ls.get('contexto_events', []);

  const horasThis = week.reduce((t, k) => t + (tracker[k] ? Object.values(tracker[k]).reduce((a,b) => a+b, 0) : 0), 0);
  const pomToday = pomHistory.filter(d => d === new Date().toDateString()).length;
  let streak = 0;
  const mk = month;
  for (let i = mk.length - 1; i >= 0; i--) {
    if (tracker[mk[i]] && Object.values(tracker[mk[i]]).some(v => v > 0)) streak++;
    else if (streak > 0) break;
  }
  const proximos = eventos.filter(e => new Date(e.date) >= new Date()).slice(0, 3).map(e => `${e.label} (${e.date})`).join(', ');
  const logs = Object.entries(diario).sort((a,b) => new Date(b[0]) - new Date(a[0])).slice(0, 2).map(([f, t]) => `[${f}] ${t.substring(0,60)}...`).join('\n');
  const satDate = ls.get('countdown_sat', '2026-08-22');
  const diasSAT = Math.ceil((new Date(satDate) - new Date()) / 86400000);

  return `Horas estudio semana: ${horasThis.toFixed(1)}h | Pomodoros hoy: ${pomToday} | Racha: ${streak} días | Días hasta SAT: ${diasSAT} | Próximos eventos: ${proximos || 'ninguno'}\nComm log:\n${logs || 'Sin registros'}`;
}

function Countdowns() {

    { name: 'SAT', progress: 40, target: '1520+' },
    { name: 'TOEFL', progress: 60, target: '105+' },
    { name: 'Saber 11', progress: 25, target: '380+' },
  ];
  return (
    <div>
      <SecLabel>Metas</SecLabel>
      {metas.map(m => (
        <div key={m.name} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.2rem 0', borderBottom: '1px solid var(--border2)' }}>
          <div style={{ flex: 1, marginRight: '0.5rem' }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)', letterSpacing: '0.5px' }}>{m.name}</div>

function HorizonteZone() {
  const days = useCountdowns();
  const items = [
    { name: 'SAT', key: 'sat' },
    { name: 'Parciales', key: 'parciales' },
    { name: 'Graduación', key: 'grad' },
    { name: 'Primavera', date: '2026-03-20' },
    { name: 'Verano', date: '2026-06-21' },
    { name: 'Nov 2027', date: '2027-11-01' },
  ];
  const calc = d => d ? Math.max(0, Math.ceil((new Date(d) - new Date()) / 86400000)) : null;
  return (
    <div>
      <SecLabel>Horizonte</SecLabel>
      {items.map(i => {
        const d = i.key ? days[i.key] : calc(i.date);
        return (
          <div key={i.name} className="horizon-row">
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)' }}>{i.name}</span>
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.65rem', color: d !== null && d <= 30 ? 'var(--primary)' : 'var(--fg3)' }}>{d !== null ? d + 'd' : '—'}</span>
          </div>
        );
      })}
    </div>
  );
}

function SpotifyZone() {
  const [track, setTrack] = useState(null);
  const [loading, setLoading] = useState(false);
  const [authed, setAuthed] = useState(false);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      setLoading(true);
      exchangeCode(code).then(token => {
        window.history.replaceState({}, '', window.location.pathname);
        if (token) setAuthed(true);
        setLoading(false);
      });
    } else {
      getValidToken().then(t => { if (t) setAuthed(true); });
    }
  }, []);

  useEffect(() => {
    if (!authed) return;
    const poll = async () => {
      const token = await getValidToken();
      if (!token) { setAuthed(false); return; }
      const t = await fetchNowPlaying(token);
      setTrack(t);
    };
    poll();
    const id = setInterval(poll, 5000);
    return () => clearInterval(id);
  }, [authed]);

  const logout = () => { ls.set('spotify_token', null); ls.set('spotify_refresh', null); ls.set('spotify_exp', 0); setAuthed(false); setTrack(null); };
  const pct = track && !track.idle && track.duration ? Math.round(track.progress / track.duration * 100) : 0;
  const comment = track && !track.idle ? getMusicComment(track.title || '', track.artist || '') : null;

  return (
    <div className="spotify-box">
      <SecLabel>Ahora suena</SecLabel>
      {loading && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)' }}>Conectando...</div>}
      {!loading && !authed && (
        <button onClick={spotifyLogin} style={{ background: 'none', border: '1px solid #1DB954', color: '#1DB954', fontFamily: 'var(--font-mono)', fontSize: '0.5rem', padding: '0.25rem 0.5rem', cursor: 'pointer', width: '100%', letterSpacing: '1px' }}>▶ Conectar Spotify</button>
      )}
      {!loading && authed && (
        <>
          {(!track || track.idle) ? (
            <div style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.65rem', color: 'var(--fg3)' }}>Nada suena</div>
          ) : (
            <>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', marginBottom: '0.3rem' }}>
                {track.cover ? <img src={track.cover} alt="cover" style={{ width: '2rem', height: '2rem', objectFit: 'cover', border: '1px solid var(--border)' }} /> : <div style={{ width: '2rem', height: '2rem', border: '1px solid var(--border)', background: 'var(--secondary)' }} />}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.65rem', color: 'var(--fg2)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{track.title}</div>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.45rem', color: 'var(--fg4)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{track.artist}</div>
                </div>
                <span style={{ fontSize: '0.5rem', color: 'var(--fg4)' }}>{track.playing ? '▶' : '⏸'}</span>
              </div>
              <div style={{ height: '1px', background: 'var(--border)', position: 'relative', marginBottom: '0.4rem' }}>
                <div style={{ height: '1px', background: '#1DB954', position: 'absolute', top: 0, left: 0, width: `${pct}%`, transition: 'width 1s linear' }} />
              </div>
              {comment && (
                <div style={{ fontSize: '0.48rem', lineHeight: '1.6' }}>
                  <div style={{ color: 'var(--max-c)', fontFamily: 'var(--font-mono)', fontStyle: 'italic' }}>{comment.max}</div>
                  <div style={{ color: 'var(--dante)', fontFamily: 'var(--font-serif)', fontStyle: 'italic', marginTop: '0.15rem' }}>{comment.dante}</div>
                </div>
              )}
            </>
          )}
          <button onClick={logout} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--fg4)', fontFamily: 'var(--font-mono)', fontSize: '0.38rem', marginTop: '0.3rem', padding: 0, letterSpacing: '1px' }}>desconectar</button>
        </>
      )}
    </div>
  );
}

function ProductividadTab() {
  const [idx, setIdx] = useState(() => Math.floor(Math.random() * toxicQuotes.length));
  const [opacity, setOpacity] = useState(1);
  useEffect(() => {
    const id = setInterval(() => {
      setOpacity(0);
      setTimeout(() => {
        setIdx(p => { let n; do { n = Math.floor(Math.random() * toxicQuotes.length); } while (n === p); return n; });
        setOpacity(1);
      }, 500);
    }, 25000);
    return () => clearInterval(id);
  }, []);
  const q = toxicQuotes[idx];
  return (
    <div style={{ width: '100%', maxWidth: '600px', textAlign: 'center', padding: '2rem 0', transition: 'opacity 0.5s', opacity }}>

    </div>

}

function ContextoTab() {
  const TYPE_LABELS = { academic: 'Académico', deadline: 'Deadline', exam: 'Examen', personal: 'Personal', social: 'Social' };
  const TYPE_COLORS = { academic: 'var(--fg3)', deadline: 'var(--primary)', exam: 'hsl(45,80%,55%)', personal: 'var(--fg4)', social: 'hsl(200,60%,55%)' };
  const [events, setEvents] = useState(() => { const s = ls.get('contexto_events', null); if (s) return s; ls.set('contexto_events', CONTEXTO_DEFAULTS); return CONTEXTO_DEFAULTS; });
  const [modal, setModal] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({ label: '', date: todayKey(), type: 'academic' });

  const openAdd = () => { setEditId(null); setForm({ label: '', date: todayKey(), type: 'academic' }); setModal(true); };
  const openEdit = ev => { setEditId(ev.id); setForm({ label: ev.label, date: ev.date, type: ev.type }); setModal(true); };
  const save = () => {
    if (!form.label || !form.date) return;
    let d = [...events];
    if (editId) d = d.map(e => e.id === editId ? { ...e, ...form } : e);
    else d.push({ id: 'c' + Date.now(), ...form });
    ls.set('contexto_events', d); setEvents(d); setModal(false);
  };
  const del = id => { if (!confirm('¿Eliminar este evento?')) return; const d = events.filter(e => e.id !== id); ls.set('contexto_events', d); setEvents(d); };

  const now = new Date(); now.setHours(0,0,0,0);
  const sorted = [...events].sort((a, b) => new Date(a.date) - new Date(b.date));

  return (
    <div style={{ width: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', marginBottom: '0.5rem' }}>
        <SecLabel>Próximos eventos</SecLabel>
        <Btn onClick={openAdd} style={{ marginLeft: 'auto', fontSize: '0.42rem' }}>+ Añadir</Btn>
      </div>
      {sorted.length === 0 && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)' }}>Sin eventos</div>}
      {sorted.map(ev => {
        const ed = new Date(ev.date + 'T12:00:00'); ed.setHours(0,0,0,0);
        const diff = Math.round((ed - now) / 86400000);
        const isPast = diff < 0;
        let txt = diff === 0 ? 'HOY' : isPast ? `+${Math.abs(diff)}d` : `${diff}d`;
        let col = isPast ? 'var(--fg4)' : diff <= 3 ? 'var(--primary)' : diff <= 14 ? 'var(--fg2)' : 'var(--fg3)';
        return (
          <div key={ev.id} className="horizon-row" style={{ padding: '0.4rem 0' }}>
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.6rem', fontWeight: 'bold', minWidth: '2.5rem', color: col }}>{txt}</span>
            <div style={{ flex: 1, margin: '0 0.5rem' }}>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.4rem', color: TYPE_COLORS[ev.type] }}>{TYPE_LABELS[ev.type]} · {new Date(ev.date + 'T12:00:00').toLocaleDateString('es-CO', { day: 'numeric', month: 'short' })}</div>
              <div style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.6rem', color: isPast ? 'var(--fg4)' : 'var(--fg2)', textDecoration: isPast ? 'line-through' : 'none' }}>{ev.label}</div>
            </div>
            <div style={{ display: 'flex', gap: '0.25rem' }}>
              <button onClick={() => openEdit(ev)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--fg4)', fontSize: '0.5rem' }}>✎</button>
              <button onClick={() => del(ev.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--fg4)', fontSize: '0.5rem' }}>×</button>
            </div>
          </div>
        );
      })}
      {modal && (
        <Modal onClose={() => setModal(false)} title={editId ? 'Editar evento' : 'Añadir evento'}>
          <input value={form.label} onChange={e => setForm(f => ({ ...f, label: e.target.value }))} placeholder="Descripción del evento" className="inp" />
          <input type="date" value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))} className="inp" />
          <select value={form.type} onChange={e => setForm(f => ({ ...f, type: e.target.value }))} className="inp">
            {Object.entries(TYPE_LABELS).map(([v, l]) => <option key={v} value={v}>{l}</option>)}
          </select>
          <div className="modal-row">
            <Btn onClick={() => setModal(false)}>Cancelar</Btn>
            <Btn onClick={save} style={{ borderColor: 'var(--primary)' }}>Guardar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

function DiarioTab() {
  const [key, setKey] = useState(todayKey());
  const [text, setText] = useState('');
  const [status, setStatus] = useState('sin cambios');
  const timeout = useRef(null);

  useEffect(() => { const d = ls.get('diario_data', {}); setText(d[key] || ''); setStatus('sin cambios'); }, [key]);

  const handleChange = val => {
    setText(val); setStatus('editando...');
    if (timeout.current) clearTimeout(timeout.current);
    timeout.current = setTimeout(() => {
      const d = ls.get('diario_data', {});
      if (val.trim()) d[key] = val; else delete d[key];
      ls.set('diario_data', d); setStatus('guardado');
      setTimeout(() => setStatus('sin cambios'), 2500);
    }, 800);
  };

  const nav = dir => {
    const d = new Date(key + 'T12:00:00'); d.setDate(d.getDate() + dir);
    const nk = d.toISOString().split('T')[0];
    if (nk > todayKey()) return;
    setKey(nk);
  };

  const dateDisplay = new Date(key + 'T12:00:00').toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const wc = text.trim() ? text.trim().split(/\s+/).length : 0;
  const diaryData = ls.get('diario_data', {});
  const dots = [];
  for (let i = 19; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = d.toISOString().split('T')[0];
    dots.push({ key: k, day: d.getDate(), has: !!(diaryData[k] && diaryData[k].trim()), isToday: k === todayKey(), isCurrent: k === key });
  }

  return (
    <div style={{ width: '100%', maxWidth: '600px' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.75rem', justifyContent: 'center', flexWrap: 'wrap' }}>
        <Btn onClick={() => nav(-1)}>←</Btn>
        <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.55rem', color: 'var(--fg3)', letterSpacing: '1px' }}>{dateDisplay}</span>
        <Btn onClick={() => nav(1)}>→</Btn>
        <Btn onClick={() => setKey(todayKey())}>HOY</Btn>
      </div>
      <textarea value={text} onChange={e => handleChange(e.target.value)} placeholder="¿Qué avanzaste? ¿Qué trabó? ¿Qué cambia mañana?" className="inp inp-serif inp-area" style={{ width: '100%', height: '10rem' }} />
      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '0.25rem' }}>
        <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.45rem', color: status === 'guardado' ? 'var(--primary)' : 'var(--fg4)' }}>{status}</span>
        <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.45rem', color: 'var(--fg4)' }}>{wc} palabras</span>
      </div>
      <div style={{ display: 'flex', gap: '0.25rem', marginTop: '0.75rem', flexWrap: 'wrap', justifyContent: 'center' }}>
        {dots.map(d => (
          <div key={d.key} onClick={() => setKey(d.key)} className={`diary-dot${d.has ? ' filled' : ''}${d.isCurrent ? ' current' : ''}`}>{d.day}</div>
        ))}
      </div>
    </div>
  );
}

function StatsTab() {
  const days = useCountdowns();
  const kpis = [{ value: '1520+', label: 'SAT' }, { value: '105+', label: 'TOEFL' }, { value: '380+', label: 'Saber 11' }];
  const counters = [
    { label: 'SAT', key: 'sat' }, { label: 'Parciales', key: 'parciales' }, { label: 'Graduación', key: 'grad' },
    { label: 'Primavera', date: '2026-03-20' }, { label: 'Verano', date: '2026-06-21' }, { label: 'Nov 2027', date: '2027-11-01' },
  ];
  const calc = d => d ? Math.max(0, Math.ceil((new Date(d) - new Date()) / 86400000)) : null;
  
  // Obtener datos de pomodoro y libros
  const pomCount = parseInt(ls.get('pomodoroCount', '0'));
  const pomHistory = ls.get('pomodoroHistory', []);
  const hoy = new Date().toDateString();
  const pomHoy = pomHistory.filter(d => d === hoy).length;
  const pomWeekly = pomHistory.filter(d => new Date(d) >= new Date(Date.now() - 7 * 86400000)).length;
  
  const lecturaData = ls.get('lectura_data', { libros: [] });
  const librosCompletados = lecturaData.libros.filter(l => l.completado).length;
  const librosMes = lecturaData.libros.filter(l => {
    if (!l.fechaInicio) return false;
    const diff = new Date() - new Date(l.fechaInicio);
    return diff < 30 * 86400000 && l.completado;
  }).length;
  
  return (
    <div style={{ width: '100%' }}>
      <div style={{ display: 'flex', gap: '0.75rem', flexWrap: 'wrap', justifyContent: 'center', marginBottom: '0.75rem' }}>
        {kpis.map(k => <div key={k.label} className="kpi"><span className="kpi-val">{k.value}</span><span className="kpi-lbl">{k.label}</span></div>)}
      </div>
      <div style={{ display: 'flex', gap: '0.75rem', flexWrap: 'wrap', justifyContent: 'center', marginBottom: '1.5rem' }}>
        {counters.map(c => {
          const d = c.key ? days[c.key] : calc(c.date);
          return <div key={c.label} className="kpi"><span className="kpi-val">{d !== null ? d + 'd' : '—'}</span><span className="kpi-lbl">{c.label}</span></div>;
        })}
      </div>

      {/* Productividad actual */}
      <div style={{ paddingTop: '1rem', borderTop: '1px solid var(--border2)' }}>
        <SecLabel>Productividad</SecLabel>
        
        {/* Row: Pomodoros y Libros */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem', marginBottom: '1rem' }}>
          <div style={{ padding: '0.5rem', backgroundColor: 'var(--bg2)', borderRadius: '0.3rem', borderLeft: '3px solid var(--primary)' }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.4rem', color: 'var(--fg4)', marginBottom: '0.3rem' }}>Pomodoros hoy</div>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '1.2rem', color: 'var(--primary)' }}>{pomHoy}</div>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.4rem', color: 'var(--fg4)', marginTop: '0.2rem' }}>({pomWeekly} semana, {pomCount} total)</div>
          </div>
          <div style={{ padding: '0.5rem', backgroundColor: 'var(--bg2)', borderRadius: '0.3rem', borderLeft: '3px solid hsl(140,50%,50%)' }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.4rem', color: 'var(--fg4)', marginBottom: '0.3rem' }}>Libros completados</div>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '1.2rem', color: 'hsl(140,50%,50%)' }}>{librosCompletados}</div>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.4rem', color: 'var(--fg4)', marginTop: '0.2rem' }}>({librosMes} este mes)</div>
          </div>
        </div>

        {/* Heatmap de pomodoros últimos 7 días */}
        <div style={{ marginBottom: '1rem' }}>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.48rem', color: 'var(--fg4)', marginBottom: '0.4rem', letterSpacing: '1px' }}>POMODOROS 7 DÍAS</div>
          <div style={{ display: 'flex', gap: '0.3rem', flexWrap: 'wrap' }}>
            {(() => {
              const hist = Array.isArray(pomHistory) ? pomHistory : [];
              const heatmap = {};
              const today = new Date();
              for (let i = 6; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const key = d.toDateString();
                heatmap[key] = hist.filter(ph => new Date(ph).toDateString() === key).length;
              }
              return Object.entries(heatmap).map(([date, count]) => {
                const intensity = Math.min(count / 5, 1);
                return (
                  <div
                    key={date}
                    style={{
                      width: '2rem',
                      height: '2rem',
                      backgroundColor: `rgba(74, 144, 226, ${0.2 + intensity * 0.8})`,
                      borderRadius: '0.25rem',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      fontSize: '0.6rem',
                      fontFamily: 'var(--font-mono)',
                      color: count > 3 ? 'var(--fg)' : 'var(--fg4)',
                      fontWeight: 'bold'
                    }}
                    title={new Date(date).toLocaleDateString()}
                  >
                    {count}
                  </div>
                );
              });
            })()}
          </div>
        </div>

        {/* Proyección */}
        <div style={{ padding: '0.5rem', backgroundColor: 'rgba(74, 144, 226, 0.1)', borderRadius: '0.3rem', borderLeft: '2px solid var(--primary)', fontFamily: 'var(--font-mono)', fontSize: '0.5rem', lineHeight: '1.6', color: 'var(--fg2)' }}>
          <div style={{ fontWeight: 'bold', marginBottom: '0.2rem' }}>📊 Proyección a ritmo actual:</div>
          <div>{pomWeekly > 0 ? (pomWeekly * 4.3).toFixed(0) : 0} pomodoros/mes</div>
          <div>{librosCompletados > 0 ? (librosCompletados / Math.max((new Date() - new Date(2025, 0, 1)) / (30 * 86400000), 1)).toFixed(1) : 0} libros/mes aprox.</div>
        </div>
      </div>
    </div>
  );
}

function TrackerTab() {
  const [data, setData] = useState(() => ls.get('tracker_data', {}));
  const [modal, setModal] = useState(false);
  const [mcat, setMcat] = useState('curricular');
  const [msubj, setMsubj] = useState(SUBJECTS.curricular[0]);
  const [mhours, setMhours] = useState('');
  const [mdate, setMdate] = useState(todayKey());
  const week = weekKeys(); const month = monthKeys();
  const getH = (s, keys) => keys.reduce((t, k) => t + (data[k] && data[k][s] ? data[k][s] : 0), 0);
  const totalWeek = Object.values(SUBJECTS).flat().reduce((t, s) => t + getH(s, week), 0);
  let streak = 0;
  for (let i = month.length - 1; i >= 0; i--) { if (data[month[i]] && Object.values(data[month[i]]).some(v => v > 0)) streak++; else if (streak > 0) break; }

  const openModal = cat => { setMcat(cat); setMsubj(SUBJECTS[cat][0]); setMhours(''); setMdate(todayKey()); setModal(true); };
  const saveLog = () => {
    const h = parseFloat(mhours); if (!msubj || isNaN(h) || h <= 0) return;
    const nd = { ...data }; if (!nd[mdate]) nd[mdate] = {}; nd[mdate][msubj] = (nd[mdate][msubj] || 0) + h;
    ls.set('tracker_data', nd); setData(nd); setModal(false);
  };

  return (
    <div style={{ width: '100%' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.75rem' }}>
        <div className="kpi"><span className="kpi-val">{totalWeek.toFixed(1)}h</span><span className="kpi-lbl">Semana</span></div>
        <div className="kpi"><span className="kpi-val">{streak}</span><span className="kpi-lbl">Racha</span></div>
      </div>
      <SecLabel>Racha 30 días</SecLabel>
      <div className="dot-row" style={{ marginBottom: '0.75rem' }}>
        {month.map(k => { const has = data[k] && Object.values(data[k]).some(v => v > 0); const isT = k === todayKey(); return <div key={k} className={`dot ${isT ? 'dot-active' : has ? 'dot-filled' : 'dot-empty'}`} />; })}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.5rem' }}>
        {(['curricular', 'examenes']).map(cat => (
          <div key={cat} style={{ border: '1px solid var(--border)', padding: '0.5rem' }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.45rem', letterSpacing: '2px', textTransform: 'uppercase', color: 'var(--fg4)', marginBottom: '0.4rem' }}>{cat === 'curricular' ? 'Curricular' : 'Exámenes'}</div>
            {SUBJECTS[cat].map(s => { const h = getH(s, week); if (h === 0) return null; return <div key={s} style={{ display: 'flex', justifyContent: 'space-between', padding: '2px 0' }}><span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.48rem', color: 'var(--fg4)' }}>{s}</span><span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.52rem', color: 'var(--fg2)' }}>{h.toFixed(1)}h</span></div>; })}
            <Btn onClick={() => openModal(cat)} style={{ marginTop: '0.4rem', fontSize: '0.42rem' }}>+ Horas</Btn>
          </div>
        ))}
      </div>
      {modal && (
        <Modal onClose={() => setModal(false)} title="Registrar horas">
          <select value={mcat} onChange={e => { setMcat(e.target.value); setMsubj(SUBJECTS[e.target.value][0]); }} className="inp">
            <option value="curricular">Curricular</option>
            <option value="examenes">Exámenes</option>
          </select>
          <select value={msubj} onChange={e => setMsubj(e.target.value)} className="inp">
            {SUBJECTS[mcat].map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          <input type="number" value={mhours} onChange={e => setMhours(e.target.value)} placeholder="Horas" step="0.25" min="0.25" className="inp" />
          <input type="date" value={mdate} onChange={e => setMdate(e.target.value)} className="inp" />
          <div className="modal-row">
            <Btn onClick={() => setModal(false)}>Cancelar</Btn>
            <Btn onClick={saveLog} style={{ borderColor: 'var(--primary)' }}>Guardar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

function NotesTab() {
  const [notes, setNotes] = useState(() => ls.get('astra_notes', []));
  const [input, setInput] = useState('');
  const [error, setError] = useState('');
  const save = () => {
    setError('');
    if (!input.trim()) { setError('La nota no puede estar vacía.'); return; }
    if (input.length > 200) { setError('Máximo 200 caracteres.'); return; }
    const nn = [{ id: Date.now(), text: input.trim(), date: new Date().toISOString() }, ...notes];
    if (nn.length > 20) nn.pop();
    ls.set('astra_notes', nn); setNotes(nn); setInput(''); setError('');
  };
  const del = id => { if (!confirm('¿Eliminar esta nota?')) return; const f = notes.filter(n => n.id !== id); ls.set('astra_notes', f); setNotes(f); };
  const edit = id => { const n = notes.find(n => n.id === id); if (n) { setInput(n.text); del(id); } };
  return (
    <div style={{ width: '100%' }}>
      <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '0.5rem', alignItems: 'flex-end' }}>
        <textarea value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); } }} placeholder="Nota rápida... (máx 200 caracteres, Enter para guardar)" className="inp inp-serif" style={{ flex: 1, height: '4rem', resize: 'none' }} />
        <Btn onClick={save}>+</Btn>
      </div>
      <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.42rem', color: 'var(--fg4)', marginBottom: '0.5rem' }}>{input.length}/200</div>
      {error && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.42rem', color: 'var(--primary)', marginBottom: '0.5rem' }}>⚠ {error}</div>}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(150px,1fr))', gap: '0.5rem' }}>
        {notes.map(n => (
          <div key={n.id} onClick={() => edit(n.id)} className="note-card">
            <div style={{ fontFamily: 'var(--font-serif)', fontSize: '0.62rem', color: 'var(--fg2)', lineHeight: '1.5', marginBottom: '0.4rem' }}>{n.text.substring(0, 100)}{n.text.length > 100 ? '...' : ''}</div>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.4rem', color: 'var(--fg4)' }}>{new Date(n.date).toLocaleDateString()}</span>
              <button onClick={e => { e.stopPropagation(); del(n.id); }} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--fg4)', fontSize: '0.5rem' }}>×</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TimeToolsTab() {
  const [tool, setTool] = useState('stopwatch');
  // Cronómetro
  const [swTime, setSwTime] = useState(0);
  const [swRun, setSwRun] = useState(false);
  const [laps, setLaps] = useState([]);
  const swRef = useRef(null);
  useEffect(() => {
    if (swRun) swRef.current = setInterval(() => setSwTime(t => t + 1), 100);
    else if (swRef.current) clearInterval(swRef.current);
    return () => { if (swRef.current) clearInterval(swRef.current); };
  }, [swRun]);
  const swDisp = `${String(Math.floor(swTime / 600)).padStart(2,'0')}:${String(Math.floor((swTime % 600) / 10)).padStart(2,'0')}.${swTime % 10}`;
  // Temporizador
  const [tMins, setTMins] = useState(5);
  const [tTime, setTTime] = useState(300);
  const [tRun, setTRun] = useState(false);
  const tRef = useRef(null);
  useEffect(() => {
    if (tRun) tRef.current = setInterval(() => setTTime(t => { if (t <= 1) { setTRun(false); return 0; } return t - 1; }), 1000);
    else if (tRef.current) clearInterval(tRef.current);
    return () => { if (tRef.current) clearInterval(tRef.current); };
  }, [tRun]);
  const tDisp = `${String(Math.floor(tTime / 60)).padStart(2,'0')}:${String(tTime % 60).padStart(2,'0')}`;
  // Alarma
  const [alarmTime, setAlarmTime] = useState('');
  const [alarmActive, setAlarmActive] = useState(false);
  const [alarmFired, setAlarmFired] = useState(false);
  const alarmRef = useRef(null);
  const audioCtx = useRef(null);
  const fireAlarm = useCallback(() => {
    setAlarmFired(true);
    try {
      if (!audioCtx.current) audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx.current;
      [0, 0.3, 0.6, 0.9].forEach(offset => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, ctx.currentTime + offset);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.25);
        osc.start(ctx.currentTime + offset);
        osc.stop(ctx.currentTime + offset + 0.25);
      });
    } catch {}
  }, []);
  useEffect(() => {
    if (!alarmActive || !alarmTime) return;
    alarmRef.current = setInterval(() => {
      const now = new Date();
      const [h, m] = alarmTime.split(':').map(Number);
      if (now.getHours() === h && now.getMinutes() === m && now.getSeconds() === 0) {
        fireAlarm(); setAlarmActive(false);
      }
    }, 1000);
    return () => clearInterval(alarmRef.current);
  }, [alarmActive, alarmTime, fireAlarm]);

  return (
    <div style={{ width: '100%' }}>
      <div className="tabs-row" style={{ marginBottom: '1rem' }}>
        {[['stopwatch', 'Cronómetro'], ['timer', 'Temporizador'], ['alarm', 'Alarma']].map(([id, label]) => (
          <Btn key={id} active={tool === id} onClick={() => setTool(id)}>{label}</Btn>
        ))}
      </div>
      {tool === 'stopwatch' && (
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '2rem', color: 'var(--fg)', letterSpacing: '1px', marginBottom: '0.75rem' }}>{swDisp}</div>
          <div style={{ display: 'flex', gap: '0.25rem', justifyContent: 'center', flexWrap: 'wrap', marginBottom: '0.5rem' }}>
            <Btn onClick={() => setSwRun(true)}>Iniciar</Btn>
            <Btn onClick={() => setSwRun(false)}>Pausa</Btn>
            <Btn onClick={() => { setSwRun(false); setSwTime(0); setLaps([]); }}>Reiniciar</Btn>
            <Btn onClick={() => setLaps(l => [...l, swDisp])}>Vuelta</Btn>
          </div>
          {laps.length > 0 && <div>{laps.map((l, i) => <div key={i} style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)' }}>Vuelta {i + 1}: {l}</div>)}</div>}
        </div>
      )}
      {tool === 'timer' && (
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '2rem', color: tRun ? 'var(--primary)' : 'var(--fg)', letterSpacing: '1px', marginBottom: '0.75rem' }}>{tDisp}</div>
          <div style={{ display: 'flex', gap: '0.25rem', justifyContent: 'center', alignItems: 'center', flexWrap: 'wrap' }}>
            <input type="number" value={tMins} onChange={e => setTMins(parseInt(e.target.value) || 5)} min={1} max={120} className="inp" style={{ width: '3.5rem', textAlign: 'center' }} />
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)' }}>min</span>
            <Btn onClick={() => { setTTime(tMins * 60); setTRun(true); }}>Iniciar</Btn>
            <Btn onClick={() => setTRun(false)}>Pausa</Btn>
            <Btn onClick={() => { setTRun(false); setTTime(tMins * 60); }}>Reiniciar</Btn>
          </div>
          {tTime === 0 && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.6rem', color: 'var(--primary)', marginTop: '0.5rem', animation: 'pulse 1s infinite' }}>⏰ Tiempo completado</div>}
        </div>
      )}
      {tool === 'alarm' && (
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '2rem', color: alarmActive ? 'var(--primary)' : 'var(--fg)', letterSpacing: '1px', marginBottom: '0.75rem' }}>{alarmTime || '--:--'}</div>
          {alarmFired && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.6rem', color: 'var(--primary)', marginBottom: '0.5rem', animation: 'pulse 0.5s infinite' }}>⏰ ALARMA</div>}
          <div style={{ display: 'flex', gap: '0.25rem', justifyContent: 'center', alignItems: 'center', flexWrap: 'wrap' }}>
            <input type="time" value={alarmTime} onChange={e => { setAlarmTime(e.target.value); setAlarmFired(false); }} className="inp" style={{ width: '8rem' }} />
            <Btn onClick={() => { if (alarmTime) { setAlarmActive(true); setAlarmFired(false); } }} active={alarmActive}>Activar</Btn>
            <Btn onClick={() => { setAlarmActive(false); setAlarmFired(false); }}>Detener</Btn>
          </div>
          {alarmActive && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.45rem', color: 'var(--fg4)', marginTop: '0.5rem' }}>Alarma activa para las {alarmTime}</div>}
        </div>
      )}
    </div>
  );
}
