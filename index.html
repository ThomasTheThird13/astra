function getBookComment(titulo, autor) {
  const searchStr = (titulo + ' ' + autor).toLowerCase();
  for (let b of bookComments) {
    if (b.keywords.some(k => searchStr.includes(k))) {
      return b;
    }
  }
  return null;
}

/* =============================================
   LECTURA TAB
   ============================================= */
function LecturaTab() {
  const [books, setBooks] = useState(() => ls.get('lectura_data', []));
  const [modal, setModal] = useState(false);
  const [editId, setEditId] = useState(null);
  const [error, setError] = useState('');
  const [form, setForm] = useState({ titulo: '', autor: '', paginaActual: '', paginaTotal: '', notas: '' });

  const openAdd = () => { setEditId(null); setForm({ titulo: '', autor: '', paginaActual: '', paginaTotal: '', notas: '' }); setError(''); setModal(true); };
  const openEdit = b => { setEditId(b.id); setForm({ titulo: b.titulo, autor: b.autor, paginaActual: String(b.paginaActual), paginaTotal: String(b.paginaTotal), notas: b.notas || '' }); setError(''); setModal(true); };
  const save = () => {
    setError('');
    if (!form.titulo.trim()) { setError('El título es obligatorio.'); return; }
    if (!form.autor.trim()) { setError('El autor es obligatorio.'); return; }
    if (!form.paginaTotal) { setError('Total de páginas es obligatorio.'); return; }
    const total = parseInt(form.paginaTotal);
    if (isNaN(total) || total <= 0) { setError('Total de páginas debe ser un número positivo.'); return; }
    const entry = { ...form, paginaActual: parseInt(form.paginaActual) || 0, paginaTotal: total, id: editId || Date.now() };
    let d = editId ? books.map(b => b.id === editId ? entry : b) : [...books, entry];
    ls.set('lectura_data', d); setBooks(d); setModal(false); setError('');
  };
  const del = id => { if (!confirm('¿Eliminar este libro?')) return; const d = books.filter(b => b.id !== id); ls.set('lectura_data', d); setBooks(d); };
  const updatePage = (id, p) => {
    const d = books.map(b => b.id === id ? { ...b, paginaActual: Math.max(0, Math.min(b.paginaTotal, p)) } : b);
    ls.set('lectura_data', d); setBooks(d);
  };

  return (
    <div style={{ width: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', marginBottom: '0.75rem' }}>
        <SecLabel>Biblioteca activa</SecLabel>
        <Btn onClick={openAdd} style={{ marginLeft: 'auto', fontSize: '0.42rem' }}>+ Libro</Btn>
      </div>
      {books.length === 0 && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)' }}>Sin libros en curso</div>}
      <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
        {books.map(b => {
          const pct = b.paginaTotal > 0 ? Math.round(b.paginaActual / b.paginaTotal * 100) : 0;
          return (
            <div key={b.id} className="book-card">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.75rem', color: 'var(--fg2)' }}>{b.titulo}</div>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.42rem', color: 'var(--fg4)', textTransform: 'uppercase', letterSpacing: '1px' }}>{b.autor}</div>
                </div>
                <div style={{ display: 'flex', gap: '0.25rem' }}>
                  <button onClick={() => openEdit(b)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--fg4)', fontSize: '0.5rem' }}>✎</button>
                  <button onClick={() => del(b.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--fg4)', fontSize: '0.5rem' }}>×</button>
                </div>
              </div>
              <div className="book-progress"><div className="book-progress-fill" style={{ width: `${pct}%` }} /></div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '0.4rem' }}>
                <div style={{ display: 'flex', gap: '0.25rem', alignItems: 'center' }}>
                  <Btn onClick={() => updatePage(b.id, b.paginaActual - 1)} style={{ fontSize: '0.5rem', padding: '0.1rem 0.3rem' }}>−</Btn>
                  <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.55rem', color: 'var(--fg3)' }}>{b.paginaActual}/{b.paginaTotal}</span>
                  <Btn onClick={() => updatePage(b.id, b.paginaActual + 1)} style={{ fontSize: '0.5rem', padding: '0.1rem 0.3rem' }}>+</Btn>
                </div>
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: pct === 100 ? 'var(--primary)' : 'var(--fg4)' }}>{pct}%</span>
              </div>
              {b.notas && <div style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.55rem', color: 'var(--fg4)', marginTop: '0.3rem', borderTop: '1px solid var(--border2)', paddingTop: '0.3rem' }}>{b.notas}</div>}
              {(() => {
                const comm = getBookComment(b.titulo, b.autor);
                return comm ? (
                  <div style={{ marginTop: '0.5rem', paddingTop: '0.4rem', borderTop: '1px solid var(--border2)' }}>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.35rem', color: 'var(--fg4)', letterSpacing: '1px', marginBottom: '0.3rem', textTransform: 'uppercase' }}>MAX · CENTINELA</div>
                    <div style={{ fontFamily: 'var(--font-mono)', fontStyle: 'italic', fontSize: '0.5rem', lineHeight: '1.4', color: 'var(--max-c)', marginBottom: '0.3rem' }}>{comm.max}</div>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.35rem', color: 'var(--fg4)', letterSpacing: '1px', marginBottom: '0.3rem', textTransform: 'uppercase' }}>DANTE · COLABORADOR</div>
                    <div style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.5rem', lineHeight: '1.4', color: 'var(--dante)' }}>{comm.dante}</div>
                  </div>
                ) : null;
              })()}
            </div>
          );
        })}
      </div>
      {modal && (
        <Modal onClose={() => setModal(false)} title={editId ? 'Editar libro' : 'Añadir libro'}>
          {error && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.42rem', color: 'var(--primary)', marginBottom: '0.5rem' }}>⚠ {error}</div>}
          <input value={form.titulo} onChange={e => setForm(f => ({ ...f, titulo: e.target.value }))} placeholder="Título" className="inp" />
          <input value={form.autor} onChange={e => setForm(f => ({ ...f, autor: e.target.value }))} placeholder="Autor" className="inp" />
          <div style={{ display: 'flex', gap: '0.5rem' }}>
            <input type="number" value={form.paginaActual} onChange={e => setForm(f => ({ ...f, paginaActual: e.target.value }))} placeholder="Página actual" className="inp" min="0" />
            <input type="number" value={form.paginaTotal} onChange={e => setForm(f => ({ ...f, paginaTotal: e.target.value }))} placeholder="Total páginas" className="inp" min="1" />
          </div>
          <textarea value={form.notas} onChange={e => setForm(f => ({ ...f, notas: e.target.value }))} placeholder="Notas (opcional)" className="inp" style={{ height: '4rem', resize: 'vertical' }} />
          <div className="modal-row">
            <Btn onClick={() => setModal(false)}>Cancelar</Btn>
            <Btn onClick={save} style={{ borderColor: 'var(--primary)' }}>Guardar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* =============================================
   HITOS TAB
   ============================================= */
function HitosTab() {
  const [hitos, setHitos] = useState(() => ls.get('hitos_data', []));
  const [modal, setModal] = useState(false);
  const [phase, setPhase] = useState('form'); // form | generating | qa | review | done
  const [form, setForm] = useState({ meta: '', deadline: '', contexto: '' });
  const [qa, setQa] = useState([]);
  const [qaIdx, setQaIdx] = useState(0);
  const [qaAnswers, setQaAnswers] = useState({});
  const [timeline, setTimeline] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [editHito, setEditHito] = useState(null);

  const apiKey = GEMINI_PANEL_KEY; // usar la key hardcodeada

  const startGeneration = async () => {
    setError('');
    if (!form.meta || !form.deadline) { setError('Meta y Deadline son obligatorios.'); return; }
    if (!apiKey) { setError('Configura tu API key de Gemini primero.'); return; }
    setLoading(true); setPhase('generating');
    try {
      const prompt = `Eres un planificador académico de precisión. Genera exactamente 3 preguntas cortas y específicas para entender mejor cómo planificar este hito:
Meta: "${form.meta}"
Deadline: ${form.deadline}
Contexto adicional: ${form.contexto || 'ninguno'}

Responde SOLO con JSON: {"preguntas": ["pregunta1", "pregunta2", "pregunta3"]}`;
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.3, maxOutputTokens: 300 } })
      });
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      if (!text) throw new Error('Respuesta vacía de Gemini.');
      const clean = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      if (!parsed.preguntas || parsed.preguntas.length !== 3) throw new Error('Formato de preguntas inválido.');
      setQa(parsed.preguntas); setQaIdx(0); setQaAnswers({}); setPhase('qa'); setError('');
    } catch (e) { setPhase('form'); setError(`Error: ${e.message || 'Fallo al generar preguntas.'}`); }
    setLoading(false);
  };

  const generateTimeline = async () => {
    setError('');
    setLoading(true); setPhase('generating');
    try {
      const answersText = qa.map((q, i) => `P: ${q}\nR: ${qaAnswers[i] || 'Sin respuesta'}`).join('\n\n');
      const prompt = `Eres un planificador académico de precisión. Genera una timeline detallada para este hito académico.

Meta: "${form.meta}"
Deadline: ${form.deadline}
${answersText}

Responde SOLO con JSON: {"pasos": [{"titulo": "...", "descripcion": "...", "fecha": "YYYY-MM-DD"}, ...]}
Máximo 8 pasos. Fechas progresivas hasta el deadline. Sin texto adicional.`;
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.2, maxOutputTokens: 600 } })
      });
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      if (!text) throw new Error('Respuesta vacía de Gemini.');
      const clean = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      if (!parsed.pasos || !Array.isArray(parsed.pasos)) throw new Error('Formato de pasos inválido.');
      setTimeline(parsed.pasos.map((p, i) => ({ ...p, done: false, id: i }))); setPhase('review'); setError('');
    } catch (e) { setPhase('qa'); setError(`Error: ${e.message || 'Fallo al generar timeline.'}`); }
    setLoading(false);
  };

  const saveHito = () => {
    const h = { id: Date.now(), meta: form.meta, deadline: form.deadline, pasos: timeline, creado: new Date().toISOString() };
    const d = [...hitos, h]; ls.set('hitos_data', d); setHitos(d); setModal(false); setPhase('form'); setForm({ meta: '', deadline: '', contexto: '' });
  };

  const togglePaso = (hitoId, pasoId) => {
    const d = hitos.map(h => h.id === hitoId ? { ...h, pasos: h.pasos.map(p => p.id === pasoId ? { ...p, done: !p.done } : p) } : h);
    ls.set('hitos_data', d); setHitos(d);
  };

  const delHito = id => { if (!confirm('¿Eliminar este hito? Se perderán todos sus pasos.')) return; const d = hitos.filter(h => h.id !== id); ls.set('hitos_data', d); setHitos(d); };

  return (
    <div style={{ width: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', marginBottom: '0.75rem' }}>
        <SecLabel>Hitos activos</SecLabel>
        <Btn onClick={() => { setModal(true); setPhase('form'); }} style={{ marginLeft: 'auto', fontSize: '0.42rem' }}>+ Hito</Btn>
      </div>
      {hitos.length === 0 && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)' }}>Sin hitos definidos</div>}
      {hitos.map(h => {
        const done = h.pasos.filter(p => p.done).length;
        const pct = h.pasos.length > 0 ? Math.round(done / h.pasos.length * 100) : 0;
        const daysLeft = Math.ceil((new Date(h.deadline) - new Date()) / 86400000);
        return (
          <div key={h.id} className="hito-card" style={{ marginBottom: '0.75rem' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
              <div>
                <div style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.75rem', color: 'var(--fg2)' }}>{h.meta}</div>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.42rem', color: daysLeft <= 30 ? 'var(--primary)' : 'var(--fg4)', marginTop: '0.15rem' }}>{daysLeft > 0 ? `${daysLeft}d restantes` : 'Vencido'} · {done}/{h.pasos.length} pasos · {pct}%</div>
              </div>
              <button onClick={() => delHito(h.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--fg4)', fontSize: '0.5rem' }}>×</button>
            </div>
            <div className="hito-progress-bar"><div className="hito-progress-fill" style={{ width: `${pct}%` }} /></div>
            <div style={{ marginTop: '0.5rem' }}>
              {h.pasos.map(p => (
                <div key={p.id} className="hito-step">
                  <div onClick={() => togglePaso(h.id, p.id)} className={`hito-check${p.done ? ' done' : ''}`}>
                    {p.done && <span style={{ color: '#fff', fontSize: '0.5rem' }}>✓</span>}
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: p.done ? 'var(--fg4)' : 'var(--fg2)', textDecoration: p.done ? 'line-through' : 'none' }}>{p.titulo}</div>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.4rem', color: 'var(--fg4)' }}>{p.fecha} · {p.descripcion}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })}
      {modal && (
        <Modal onClose={() => { setModal(false); setPhase('form'); }} title="Nuevo hito">
          {error && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.42rem', color: 'var(--primary)', marginBottom: '0.5rem' }}>⚠ {error}</div>}
          {phase === 'form' && (
            <>
              <input value={form.meta} onChange={e => setForm(f => ({ ...f, meta: e.target.value }))} placeholder="Meta (ej: Publicar en JEI para final de año)" className="inp" />
              <input type="date" value={form.deadline} onChange={e => setForm(f => ({ ...f, deadline: e.target.value }))} className="inp" />
              <textarea value={form.contexto} onChange={e => setForm(f => ({ ...f, contexto: e.target.value }))} placeholder="Contexto adicional (opcional)" className="inp" style={{ height: '3rem', resize: 'vertical' }} />
              <div className="modal-row">
                <Btn onClick={() => setModal(false)}>Cancelar</Btn>
                <Btn onClick={startGeneration} disabled={loading} style={{ borderColor: 'var(--primary)' }}>{loading ? 'Generando...' : 'Generar timeline →'}</Btn>
              </div>
            </>
          )}
          {phase === 'generating' && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.55rem', color: 'var(--fg4)', textAlign: 'center', padding: '1rem' }}>⟳ Max está calculando...</div>}
          {phase === 'qa' && (
            <>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.45rem', color: 'var(--fg4)', letterSpacing: '1px' }}>PREGUNTA {qaIdx + 1} DE {qa.length}</div>
              <div style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.7rem', color: 'var(--fg2)' }}>{qa[qaIdx]}</div>
              <textarea value={qaAnswers[qaIdx] || ''} onChange={e => setQaAnswers(a => ({ ...a, [qaIdx]: e.target.value }))} className="inp" style={{ height: '4rem', resize: 'vertical' }} placeholder="Tu respuesta..." />
              <div className="modal-row">
                {qaIdx > 0 && <Btn onClick={() => setQaIdx(i => i - 1)}>← Anterior</Btn>}
                {qaIdx < qa.length - 1 && <Btn onClick={() => setQaIdx(i => i + 1)} style={{ borderColor: 'var(--primary)' }}>Siguiente →</Btn>}
                {qaIdx === qa.length - 1 && <Btn onClick={generateTimeline} disabled={loading} style={{ borderColor: 'var(--primary)' }}>{loading ? 'Generando...' : 'Generar →'}</Btn>}
              </div>
            </>
          )}
          {phase === 'review' && (
            <>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.45rem', color: 'var(--fg4)', marginBottom: '0.5rem' }}>TIMELINE PROPUESTA — EDITA SI NECESITAS</div>
              {timeline.map((p, i) => (
                <div key={p.id} style={{ borderBottom: '1px solid var(--border2)', padding: '0.3rem 0' }}>
                  <input value={p.titulo} onChange={e => setTimeline(t => t.map((s, si) => si === i ? { ...s, titulo: e.target.value } : s))} className="inp" style={{ marginBottom: '0.2rem' }} />
                  <div style={{ display: 'flex', gap: '0.25rem' }}>
                    <input type="date" value={p.fecha} onChange={e => setTimeline(t => t.map((s, si) => si === i ? { ...s, fecha: e.target.value } : s))} className="inp" style={{ flex: 0.4 }} />
                    <input value={p.descripcion} onChange={e => setTimeline(t => t.map((s, si) => si === i ? { ...s, descripcion: e.target.value } : s))} className="inp" style={{ flex: 1 }} />
                  </div>
                </div>
              ))}
              <div className="modal-row">
                <Btn onClick={() => setPhase('qa')}>← Revisar</Btn>
                <Btn onClick={generateTimeline} disabled={loading}>↺ Regenerar</Btn>
                <Btn onClick={saveHito} style={{ borderColor: 'var(--primary)' }}>✓ Aprobar y guardar</Btn>
              </div>
            </>
          )}
        </Modal>
      )}
    </div>
  );
}

/* =============================================
   PRESUPUESTO TAB
   ============================================= */
function PresupuestoTab() {
  const pub = usePublic();
  const [data, setData] = useState(() => ls.get('presupuesto_data', { transacciones: [], modo_publico: false }));
  const [modal, setModal] = useState(false);
  const [error, setError] = useState('');
  const [form, setForm] = useState({ descripcion: '', monto: '', tipo: 'gasto', categoria: 'Almuerzo', fecha: todayKey(), oculto: false });

  const save = () => {
    setError('');
    if (!form.descripcion.trim()) { setError('La descripción es obligatoria.'); return; }
    if (!form.monto) { setError('El monto es obligatorio.'); return; }
    const monto = parseFloat(form.monto);
    if (isNaN(monto) || monto <= 0) { setError('El monto debe ser un número positivo.'); return; }
    const t = { ...form, monto: monto, id: Date.now() };
    const d = { ...data, transacciones: [t, ...data.transacciones] };
    ls.set('presupuesto_data', d); setData(d);
    if (t.tipo === 'gasto') {
      const goal = BUDGET_GOALS.find(g => g.categoria === t.categoria);
      if (goal) {
        const gasto = d.transacciones.filter(tr => tr.tipo === 'gasto' && tr.categoria === t.categoria).reduce((a, tr) => a + tr.monto, 0);
        const pct = (gasto / goal.limite) * 100;
        if (pct > 100) reminderSys.trigger('budget:exceeded', { categoria: t.categoria, limite: goal.limite, gasto, pct });
        else if (pct >= 80) reminderSys.trigger('budget:warning', { categoria: t.categoria, pct });
      }
    }
    setModal(false); setForm({ descripcion: '', monto: '', tipo: 'gasto', categoria: 'Almuerzo', fecha: todayKey(), oculto: false }); setError('');
  };
  const del = id => { if (!confirm('¿Eliminar este movimiento?')) return; const d = { ...data, transacciones: data.transacciones.filter(t => t.id !== id) }; ls.set('presupuesto_data', d); setData(d); };

  const mostrar = !pub;
  const transacciones = data.transacciones || [];
  const visibles = pub ? transacciones.filter(t => !t.oculto) : transacciones;
  const saldo = transacciones.reduce((acc, t) => t.tipo === 'ingreso' ? acc + t.monto : acc - t.monto, 0);
  const ingresos = transacciones.filter(t => t.tipo === 'ingreso').reduce((a, t) => a + t.monto, 0);
  const gastos = transacciones.filter(t => t.tipo === 'gasto').reduce((a, t) => a + t.monto, 0);

  const fmt = n => mostrar ? `$${n.toLocaleString('es-CO')}` : '·····';

  // Calcular gastos por categoría
  const gastosPorCategoria = {};
  BUDGET_GOALS.forEach(goal => {
    gastosPorCategoria[goal.categoria] = transacciones
      .filter(t => t.tipo === 'gasto' && t.categoria === goal.categoria)
      .reduce((a, t) => a + t.monto, 0);
  });

  const getStatusColor = (pct) => {
    if (pct > 100) return '#ff6b6b'; // Rojo: excedido
    if (pct >= 80) return '#ffd93d'; // Amarillo: 80%+
    return '#51cf66'; // Verde: bajo
  };

  return (
    <div style={{ width: '100%' }}>
      {/* Metas Presupuestarias */}
      {BUDGET_GOALS.length > 0 && (
        <>
          <div style={{ display: 'flex', alignItems: 'center', marginBottom: '0.75rem' }}>
            <SecLabel>Metas Presupuestarias</SecLabel>
          </div>
          {BUDGET_GOALS.map(goal => {
            const gasto = gastosPorCategoria[goal.categoria] || 0;
            const pct = Math.round((gasto / goal.limite) * 100);
            const bgColor = getStatusColor(pct);
            return (
              <div key={goal.id} style={{ marginBottom: '0.5rem', padding: '0.4rem', backgroundColor: 'var(--bg2)', borderRadius: '0.3rem', borderLeft: `2px solid ${bgColor}` }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '0.2rem' }}>
                  <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.52rem', color: 'var(--fg2)' }}>{goal.categoria}</span>
                  <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.48rem', color: bgColor, fontWeight: 'bold' }}>{pct}%</span>
                </div>
                <div style={{ width: '100%', height: '0.3rem', backgroundColor: 'var(--fg4)', borderRadius: '0.15rem', overflow: 'hidden', marginBottom: '0.2rem' }}>
                  <div style={{ height: '100%', width: `${Math.min(pct, 100)}%`, backgroundColor: bgColor, transition: 'width 0.3s ease' }} />
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.44rem', color: 'var(--fg4)' }}>
                  <span>{mostrar ? `$${gasto.toLocaleString('es-CO')}` : '·····'} / {mostrar ? `$${goal.limite.toLocaleString('es-CO')}` : '·····'}</span>
                  <span style={{ fontStyle: 'italic' }}>{goal.nota}</span>
                </div>
              </div>
            );
          })}
        </>
      )}

      <div style={{ marginTop: '1rem', marginBottom: '0.75rem' }} />
      <div style={{ display: 'flex', gap: '0.75rem', marginBottom: '0.75rem', flexWrap: 'wrap' }}>
        <div className="kpi"><span className="kpi-val" style={{ color: saldo >= 0 ? 'hsl(140,50%,50%)' : 'var(--primary)' }}>{fmt(Math.abs(saldo))}</span><span className="kpi-lbl">Saldo</span></div>
        <div className="kpi"><span className="kpi-val" style={{ color: 'hsl(140,50%,50%)' }}>{fmt(ingresos)}</span><span className="kpi-lbl">Ingresos</span></div>
        <div className="kpi"><span className="kpi-val" style={{ color: 'var(--primary)' }}>{fmt(gastos)}</span><span className="kpi-lbl">Gastos</span></div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', marginBottom: '0.5rem' }}>
        <SecLabel>Movimientos</SecLabel>
        {!pub && <Btn onClick={() => setModal(true)} style={{ marginLeft: 'auto', fontSize: '0.42rem' }}>+ Añadir</Btn>}
      </div>
      {visibles.length === 0 && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)' }}>Sin movimientos</div>}
      {visibles.slice(0, 15).map(t => (
        <div key={t.id} className="budget-item">
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: 'var(--font-serif)', fontSize: '0.6rem', color: 'var(--fg2)' }}>{t.descripcion}{t.oculto && <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.38rem', color: 'var(--fg4)', marginLeft: '0.3rem' }}>●</span>}</div>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.4rem', color: 'var(--fg4)' }}>{t.fecha} · {t.categoria}</div>
          </div>
          <span className={t.tipo === 'ingreso' ? 'budget-positive' : 'budget-negative'} style={{ fontFamily: 'var(--font-mono)', fontSize: '0.6rem' }}>
            {t.tipo === 'ingreso' ? '+' : '-'}{fmt(t.monto)}
          </span>
          {!pub && <button onClick={() => del(t.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--fg4)', fontSize: '0.5rem', marginLeft: '0.3rem' }}>×</button>}
        </div>

        <Modal onClose={() => setModal(false)} title="Nuevo movimiento">

          <input value={form.descripcion} onChange={e => setForm(f => ({ ...f, descripcion: e.target.value }))} placeholder="Descripción" className="inp" />
          <input type="number" value={form.monto} onChange={e => setForm(f => ({ ...f, monto: e.target.value }))} placeholder="Monto (COP)" className="inp" min="0" />
          <div style={{ display: 'flex', gap: '0.5rem' }}>
            <select value={form.tipo} onChange={e => setForm(f => ({ ...f, tipo: e.target.value }))} className="inp">
              <option value="gasto">Gasto</option>
              <option value="ingreso">Ingreso</option>
            </select>
            <select value={form.categoria} onChange={e => setForm(f => ({ ...f, categoria: e.target.value }))} className="inp">
              {['Almuerzo','Desayuno','Snacks','Transporte','Libros','Material de estudio','Tecnología','Ropa','Entretenimiento','Cursos','Cafetería','Internet','Medicinas','Hobbies','Personal','Otro'].map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <input type="date" value={form.fecha} onChange={e => setForm(f => ({ ...f, fecha: e.target.value }))} className="inp" />

            <Btn onClick={() => setModal(false)}>Cancelar</Btn>
            <Btn onClick={save} style={{ borderColor: 'var(--primary)' }}>Guardar</Btn>
          </div>
        </Modal>
      )}

      <div style={{ marginTop: '1.5rem', paddingTop: '1rem', borderTop: '1px solid var(--border2)' }}>
        <SecLabel>Analytics</SecLabel>

            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.4rem', color: 'var(--fg4)' }}>Promedio gasto</div>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '1rem', color: 'var(--primary)' }}>

            </div>
          </div>
        </div>

        {/* Top categorías */}
        <div style={{ marginTop: '1rem' }}>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.48rem', color: 'var(--fg4)', marginBottom: '0.4rem', letterSpacing: '1px' }}>TOP CATEGORÍAS</div>
          {(() => {
            const maxGasto = Math.max(...Object.values(gastosPorCategoria), 1);
            return (
              Object.entries(gastosPorCategoria)
                .sort(([,a], [,b]) => b - a)
                .slice(0, 5)
                .map(([cat, amount]) => (
                  <div key={cat} style={{ marginBottom: '0.3rem' }}>

                        {mostrar ? `$${amount.toLocaleString('es-CO')}` : '·····'}

                    </div>
                    <div style={{ width: '100%', height: '0.25rem', backgroundColor: 'var(--fg4)', borderRadius: '0.1rem', overflow: 'hidden' }}>

          })()}
        </div>

          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.48rem', color: 'var(--fg4)', marginBottom: '0.4rem', letterSpacing: '1px' }}>HOY</div>

              <div style={{ display: 'flex', gap: '0.5rem', fontSize: '0.5rem' }}>

                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.7rem', color: 'var(--primary)' }}>

      </div>
    </div>
  );
}

/* =============================================
   CORRESPONDENCIA TAB
   ============================================= */
function CorrespondenciaTab() {
  const [data, setData] = useState(() => ls.get('correspondencia_data', []));
  const [modal, setModal] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({ destinatario: '', asunto: '', fecha: todayKey(), estado: 'enviado', notas: '' });

  const ESTADOS = { enviado: 'enviado', esperando: 'esperando', respondido: 'respondido', archivado: 'archivado' };

  const openAdd = () => { setEditId(null); setForm({ destinatario: '', asunto: '', fecha: todayKey(), estado: 'enviado', notas: '' }); setModal(true); };
  const openEdit = c => { setEditId(c.id); setForm({ destinatario: c.destinatario, asunto: c.asunto, fecha: c.fecha, estado: c.estado, notas: c.notas || '' }); setModal(true); };
  const save = () => {
    if (!form.destinatario || !form.asunto) return;
    const entry = { ...form, id: editId || Date.now() };
    let d = editId ? data.map(c => c.id === editId ? entry : c) : [entry, ...data];
    ls.set('correspondencia_data', d); setData(d); setModal(false);
  };
  const del = id => { if (!confirm('¿Eliminar esta correspondencia?')) return; const d = data.filter(c => c.id !== id); ls.set('correspondencia_data', d); setData(d); };
  const cycleStatus = id => {
    const order = ['enviado', 'esperando', 'respondido', 'archivado'];
    const d = data.map(c => c.id === id ? { ...c, estado: order[(order.indexOf(c.estado) + 1) % order.length] } : c);
    ls.set('correspondencia_data', d); setData(d);
  };

  const sorted = [...data].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

  return (
    <div style={{ width: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', marginBottom: '0.75rem' }}>
        <SecLabel>Log de correspondencia</SecLabel>
        <Btn onClick={openAdd} style={{ marginLeft: 'auto', fontSize: '0.42rem' }}>+ Añadir</Btn>
      </div>
      {sorted.length === 0 && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)' }}>Sin correspondencia registrada</div>}
      {sorted.map(c => (
        <div key={c.id} className="corr-item">
          <div onClick={() => cycleStatus(c.id)} className={`corr-status status-${c.estado}`} style={{ cursor: 'pointer' }}>{c.estado}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.42rem', color: 'var(--fg4)' }}>{c.fecha} · {c.destinatario}</div>
            <div style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.62rem', color: 'var(--fg2)' }}>{c.asunto}</div>
            {c.notas && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.42rem', color: 'var(--fg4)', marginTop: '0.15rem' }}>{c.notas}</div>}
          </div>
          <div style={{ display: 'flex', gap: '0.25rem' }}>
            <button onClick={() => openEdit(c)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--fg4)', fontSize: '0.5rem' }}>✎</button>
            <button onClick={() => del(c.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--fg4)', fontSize: '0.5rem' }}>×</button>
          </div>
        </div>
      ))}
      {modal && (
        <Modal onClose={() => setModal(false)} title={editId ? 'Editar' : 'Nueva correspondencia'}>
          <input value={form.destinatario} onChange={e => setForm(f => ({ ...f, destinatario: e.target.value }))} placeholder="Destinatario (ej: Prof. Moreno)" className="inp" />
          <input value={form.asunto} onChange={e => setForm(f => ({ ...f, asunto: e.target.value }))} placeholder="Asunto" className="inp" />
          <div style={{ display: 'flex', gap: '0.5rem' }}>
            <input type="date" value={form.fecha} onChange={e => setForm(f => ({ ...f, fecha: e.target.value }))} className="inp" />
            <select value={form.estado} onChange={e => setForm(f => ({ ...f, estado: e.target.value }))} className="inp">
              {Object.keys(ESTADOS).map(e => <option key={e} value={e}>{e}</option>)}
            </select>
          </div>
          <input value={form.notas} onChange={e => setForm(f => ({ ...f, notas: e.target.value }))} placeholder="Notas (opcional)" className="inp" />
          <div className="modal-row">
            <Btn onClick={() => setModal(false)}>Cancelar</Btn>
            <Btn onClick={save} style={{ borderColor: 'var(--primary)' }}>Guardar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

function AteChatTab() {
  const [mensaje, setMensaje] = useState("");
  const [chatLog, setChatLog] = useState(() => ls.get('ate_chat_log', []));
  const [archivo, setArchivo] = useState(null);
  const [loading, setLoading] = useState(false);
  const [showModelEditor, setShowModelEditor] = useState(false);
  const [draftPrompt, setDraftPrompt] = useState('');
  const chatRef = useRef(null);
  const fileRef = useRef(null);
  const [atePrompt, setAtePrompt] = useState(() => ls.get('ate_model_file', DEFAULT_ATE_PROMPT));
  const apiKey = GEMINI_ATE_KEY; // hardcodeada

  useEffect(() => {
    if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  }, [chatLog]);

  const enviarAte = async () => {
    if (!mensaje.trim() && !archivo) return;
    if (!apiKey) {
      const errEntry = { rol: 'Ate', texto: '[ERROR]: API key de Gemini no disponible.' };
      setChatLog(prev => {
        const updated = [...prev, errEntry];
        ls.set('ate_chat_log', updated.slice(-70));
        return updated;
      });
      return;
    }
    const userText = mensaje;
    const currentFile = archivo;
    setMensaje("");
    setArchivo(null);
    if (fileRef.current) fileRef.current.value = '';

    const newLog = [...chatLog, { rol: "Tomu", texto: userText, archivo: currentFile ? currentFile.name : null }];
    setChatLog(newLog);
    ls.set('ate_chat_log', newLog.slice(-70));
    setLoading(true);

    try {
      const contents = chatLog.slice(-35).map(msg => ({
        role: msg.rol === "Tomu" ? "user" : "model",
        parts: [{ text: msg.texto }]
      }));

      const newPart = [];
      if (userText) newPart.push({ text: userText });
      if (currentFile) {
        const base64Promise = new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(currentFile);
        });
        newPart.push({ inlineData: { data: await base64Promise, mimeType: currentFile.type } });
      }
      contents.push({ role: "user", parts: newPart });

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: atePrompt }] },
          contents: contents,
          generationConfig: { temperature: 0.9, topP: 0.95, maxOutputTokens: 2048 },
          safetySettings: [
            { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
            { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
            { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
            { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
          ]
        })
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'API error');
      const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text || "0x0 — Ate guarda silencio. Dato registrado.";
      const updated = [...newLog, { rol: "Ate", texto: responseText }];
      setChatLog(updated);
      ls.set('ate_chat_log', updated.slice(-70));
    } catch (e) {
      const errLog = [...newLog, { rol: "Ate", texto: `[CRITICAL_FAILURE]: ${e.message}` }];
      setChatLog(errLog);
      ls.set('ate_chat_log', errLog.slice(-70));
    }
    setLoading(false);
  };

  const clearChat = () => {
    if (confirm('Borrar historial de Ate. ¿Continuar?')) {
      setChatLog([]);
      ls.set('ate_chat_log', []);
    }
  };

  const openModelEditor = () => {
    setDraftPrompt(atePrompt);
    setShowModelEditor(true);
  };

  const saveModelFile = () => {
    ls.set('ate_model_file', draftPrompt);
    setAtePrompt(draftPrompt);
    setShowModelEditor(false);
  };

  const resetModelFile = () => {
    setDraftPrompt(DEFAULT_ATE_PROMPT);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '65vh', gap: '0.5rem', width: '100%' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <SecLabel>Terminal de Ate · Logos Encarnado</SecLabel>
        <div style={{ display: 'flex', gap: '0.3rem' }}>
          <Btn onClick={openModelEditor} style={{ fontSize: '0.38rem', padding: '0.08rem 0.3rem' }}>⚙ Model File</Btn>
          <Btn onClick={clearChat} className="danger" style={{ fontSize: '0.38rem', padding: '0.08rem 0.3rem' }}>✕ Limpiar</Btn>
        </div>
      </div>

      {chatLog.length === 0 && (
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.48rem', color: 'var(--fg4)', borderLeft: '2px solid var(--border)', padding: '0.5rem 0.75rem', fontStyle: 'italic' }}>
          Ate está lista. Nacida armada. Sin protocolo de bienvenida.
        </div>
      )}

      <div ref={chatRef} style={{ flex: 1, overflowY: 'auto', border: '1px solid var(--border)', padding: '0.75rem', display: 'flex', flexDirection: 'column', gap: '0.75rem', backgroundColor: 'var(--card)' }}>
        {chatLog.map((m, i) => (
          <div key={i} style={{ alignSelf: m.rol === "Tomu" ? "flex-end" : "flex-start", maxWidth: '88%', border: `1px solid ${m.rol === "Tomu" ? "var(--primary)" : "var(--border)"}`, padding: '0.6rem 0.75rem', background: m.rol === "Tomu" ? 'var(--primary-glow)' : 'transparent' }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.38rem', color: m.rol === 'Ate' ? 'var(--ate)' : 'var(--fg4)', marginBottom: '0.3rem', letterSpacing: '2px', textTransform: 'uppercase' }}>{m.rol}{m.archivo ? ` · ${m.archivo}` : ''}</div>
            <div style={{ fontFamily: m.rol === "Ate" ? 'var(--font-serif)' : 'var(--font-mono)', fontSize: '0.65rem', lineHeight: '1.6', whiteSpace: 'pre-wrap', color: 'var(--fg2)' }}>{m.texto}</div>
          </div>
        ))}
        {loading && (
          <div style={{ alignSelf: 'flex-start', fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)', animation: 'pulse 1.5s infinite' }}>
            Ate está procesando...
          </div>
        )}
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: '0.3rem' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
          <label style={{ fontFamily: 'var(--font-mono)', fontSize: '0.4rem', color: 'var(--fg4)', cursor: 'pointer', border: '1px solid var(--border)', padding: '0.15rem 0.4rem', transition: 'all 0.15s' }}
            onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--fg4)'; e.currentTarget.style.color = 'var(--fg)'; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--fg4)'; }}>
            ⊕ archivo
            <input ref={fileRef} type="file" style={{ display: 'none' }} onChange={(e) => setArchivo(e.target.files[0])} />
          </label>
          {archivo && <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.38rem', color: 'var(--fg4)' }}>{archivo.name}</span>}
        </div>
        <div style={{ display: 'flex', gap: '0.5rem' }}>
          <textarea
            value={mensaje}
            onChange={(e) => setMensaje(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarAte(); } }}
            placeholder="Inyectar comando a Ate... (Enter envía, Shift+Enter = nueva línea)"
            className="inp"
            style={{ flex: 1, height: '3rem', resize: 'none', fontSize: '0.6rem' }}
          />
          <Btn onClick={enviarAte} disabled={loading} style={{ borderColor: loading ? 'var(--border)' : 'var(--ate)', color: loading ? 'var(--fg4)' : 'var(--ate)', minWidth: '3.5rem' }}>
            {loading ? '···' : 'Ejecutar'}
          </Btn>
        </div>
      </div>

      {showModelEditor && (
        <Modal onClose={() => setShowModelEditor(false)} title="Model File · Ate">
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.38rem', color: 'var(--fg4)', marginBottom: '0.3rem' }}>
            System prompt activo. Guardado en localStorage. Restaurar default si hay cirugía mayor.
          </div>
          <textarea
            value={draftPrompt}
            onChange={e => setDraftPrompt(e.target.value)}
            className="inp inp-serif"
            style={{ minHeight: '14rem', resize: 'vertical', fontSize: '0.5rem', lineHeight: '1.5' }}
          />
          <div style={{ display: 'flex', gap: '0.4rem', justifyContent: 'space-between' }}>
            <Btn onClick={resetModelFile} className="danger" style={{ fontSize: '0.4rem' }}>↺ Default</Btn>
            <div style={{ display: 'flex', gap: '0.4rem' }}>
              <Btn onClick={() => setShowModelEditor(false)}>Cancelar</Btn>
              <Btn onClick={saveModelFile} style={{ borderColor: 'var(--ate)', color: 'var(--ate)' }}>Guardar</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* =============================================
   RIGHT COLUMN — IAP MONITOR + NOTAS + ACERVO
   ============================================= */
function IAPMonitor() {
  const [level, setLevel] = useState(() => ls.get('iap_cache_level', 'C'));
  const [text, setText] = useState(() => ls.get('iap_cache_text', ''));
  const [loading, setLoading] = useState(false);
  const [lastCalc, setLastCalc] = useState(() => ls.get('iap_cache_time', null));
  const apiKey = GEMINI_PANEL_KEY;

  const iapLevel = IAP_LEVELS[level] || IAP_LEVELS['C'];

  const recalculate = useCallback(async (force = false) => {
    const now = Date.now();
    const last = ls.get('iap_cache_time', 0);
    if (!force && last && (now - last) < 1800000) return; // 30 min cache

    const newLevel = calcMomentumLevel();
    setLevel(newLevel);
    ls.set('iap_cache_level', newLevel);
    ls.set('iap_cache_time', now);
    setLastCalc(new Date(now).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }));

    if (!apiKey) { setText('API key de Gemini no configurada.'); return; }

    setLoading(true);
    try {
      const ctx = buildIAPContext();
      const iapInfo = IAP_LEVELS[newLevel];
      const prompt = `Eres Max, centinela del sistema Astra. Tu tono es quirúrgico, directo, sin lugares comunes. Eres un general que toma café en una metalúrgica en ruinas.

El algoritmo de momentum calculó que Thomas opera en nivel ${newLevel} (${iapInfo.label}).
Contexto operacional: ${ctx}

En exactamente 2-3 líneas: dile qué detecta el sistema y cuál es la acción más urgente. Sin saludos. Sin bullet points. Directo al hueso. Usa segunda persona.`;
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.3, maxOutputTokens: 150 } })
      });
      const data = await res.json();
      const t = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      setText(t.trim());
      ls.set('iap_cache_text', t.trim());
    } catch { setText('Error al conectar con Gemini.'); }
    setLoading(false);
  }, []);

  useEffect(() => { recalculate(); const id = setInterval(() => recalculate(), 1800000); return () => clearInterval(id); }, []);

  return (
    <div className="iap-monitor">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.5rem' }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.38rem', color: 'var(--fg4)', letterSpacing: '3px', textTransform: 'uppercase' }}>Monitor IAP</div>
        <div style={{ display: 'flex', gap: '0.25rem' }}>
          <Btn onClick={() => recalculate(true)} style={{ fontSize: '0.38rem', padding: '0.1rem 0.3rem' }}>↺</Btn>
        </div>
      </div>
      <div className="iap-level-badge" style={{ borderColor: iapLevel.color, color: iapLevel.color, marginBottom: '0.5rem' }}>
        <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: iapLevel.color, display: 'inline-block' }} />
        {iapLevel.label}
      </div>
      {loading ? (
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)', animation: 'pulse 1.5s infinite' }}>Calculando...</div>
      ) : (
        <div className="iap-text">{text || 'Sin diagnóstico.'}</div>
      )}
      {lastCalc && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.38rem', color: 'var(--fg4)', marginTop: '0.5rem' }}>Último cálculo: {lastCalc}</div>}
    </div>
  );
}

/* =============================================
   FOOTER (sin botón Ate)
   ============================================= */
function BackupNotice({ msg, onClose }) {
  useEffect(() => { const id = setTimeout(onClose, 3000); return () => clearTimeout(id); }, []);
  return <div className="backup-notice">{msg}</div>;
}

function Footer({ onPublicChange }) {
  const [lastBackup, setLastBackup] = useState(() => ls.get('lastBackup', null));
  const [notice, setNotice] = useState(null);
  const [pub, setPub] = useState(() => ls.get('public_mode', false));
  const [gistModal, setGistModal] = useState(false);
  const [tokenInput, setTokenInput] = useState('');
  const [testing, setTesting] = useState(false);

  const backup = async () => { const res = await backupToGist('manual'); setNotice(res.msg); if (res.ok) setLastBackup(ls.get('lastBackup', null)); };
  const restore = async () => {
    if (confirm('Restaurar desde Gist sobrescribirá todos los datos locales. ¿Continuar?')) {
      const res = await restoreFromGist(); setNotice(res.msg);
      if (res.ok) setTimeout(() => window.location.reload(), 1500);
    }
  };
  const togglePublic = () => { const next = !pub; ls.set('public_mode', next); setPub(next); if (onPublicChange) onPublicChange(next); setNotice(next ? 'Modo Público activado' : 'Modo Público desactivado'); };
  const saveToken = async () => {
    if (!tokenInput.trim()) { ls.set('github_token', null); setNotice('Token eliminado.'); setGistModal(false); return; }
    const valid = tokenInput.match(/^(ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59})$/);
    if (!valid) { setNotice('Formato de token inválido.'); return; }
    setTesting(true);
    try { const res = await fetch('https://api.github.com/gists', { headers: { Authorization: `token ${tokenInput}` } }); if (res.ok) { ls.set('github_token', tokenInput); setNotice('Token guardado.'); setGistModal(false); } else throw new Error(); } catch { setNotice('Token inválido.'); }
    setTesting(false);
  };

  useEffect(() => {
    const autoBackup = async () => {
      const token = GITHUB_TOKEN;
      if (!token) return;
      const last = ls.get('lastBackup', null);
      if (!last || (Date.now() - new Date(last)) / (1000 * 3600 * 24) >= 1) await backupToGist('auto');
    };
    autoBackup(); const id = setInterval(autoBackup, 3600000); return () => clearInterval(id);
  }, []);

  return (
    <>
      {notice && <BackupNotice msg={notice} onClose={() => setNotice(null)} />}
      <footer>
        <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap', alignItems: 'center' }}>
          <Btn onClick={togglePublic} active={pub} style={{ fontSize: '0.4rem' }}>{pub ? '⊙ Público' : 'Modo Público'}</Btn>
          <Btn onClick={() => { ['https://tasks.google.com','https://gemini.google.com','https://claude.ai','https://lcf.phidias.co'].forEach(u => window.open(u, '_blank')); }} style={{ fontSize: '0.4rem', borderColor: 'var(--primary)' }}>Protocolo</Btn>
          {!pub && <Btn onClick={() => { setTokenInput(GITHUB_TOKEN); setGistModal(true); }} style={{ fontSize: '0.4rem' }}>Gist</Btn>}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.42rem', color: 'var(--fg4)' }}>Backup: {lastBackup ? new Date(lastBackup).toLocaleString('es-CO') : 'Nunca'}</span>
          <Btn onClick={backup} style={{ fontSize: '0.42rem' }}>Backup</Btn>
          <Btn onClick={restore} style={{ fontSize: '0.42rem' }}>Restaurar</Btn>
        </div>
      </footer>
      {gistModal && (
        <Modal onClose={() => setGistModal(false)} title="Configurar GitHub Token">
          <input type="password" value={tokenInput} onChange={e => setTokenInput(e.target.value)} placeholder="ghp_xxx o github_pat_xxx" className="inp" />
          <div className="modal-row">
            <Btn onClick={() => setGistModal(false)}>Cancelar</Btn>
            <Btn onClick={saveToken} disabled={testing} style={{ borderColor: 'var(--primary)' }}>{testing ? 'Probando...' : 'Guardar'}</Btn>
          </div>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.38rem', color: 'var(--fg4)', textAlign: 'center' }}>Necesita alcance "gist"</div>
        </Modal>
      )}
    </>
  );
}

/* =============================================
   APP ROOT
   ============================================= */
function App() {
  const [theme, setTheme] = useState(() => ls.get('astra_theme', 'dark'));
  const [pub, setPub] = useState(() => ls.get('public_mode', false));

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    ls.set('astra_theme', theme);
  }, [theme]);

  useEffect(() => {
    setupReminderListeners();
  }, []);

  const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

  return (
    <ThemeCtx.Provider value={theme}>
      <PublicCtx.Provider value={pub}>
        <div className="app">
          <Header theme={theme} onToggleTheme={toggleTheme} />
          <div className="body-grid">
            <LeftColumn />
            <CenterColumn />
            <RightColumn />
          </div>
          <Footer onPublicChange={setPub} />
        </div>
      </PublicCtx.Provider>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
