/* ========== ESTILOS V8: THE DESK ========== */
:root {
  --bg: #050505; --fg: #e0e0e0; --fg2: #b0b0b0; --fg3: #808080; --fg4: #505050;

  --primary: hsl(0, 82%, 45%); --primary-dim: hsl(0, 82%, 45%, 0.15); --primary-glow: hsl(0, 82%, 45%, 0.08);
  --secondary: #0f0f0f; --dante: #aaaaaa; --max-c: #787878; --ate: hsl(280, 70%, 60%);
  --radius: 2px; --font-mono: 'JetBrains Mono', monospace; --font-serif: 'Libre Baskerville', Georgia, serif;
  --desk-texture: #080808;
}
[data-theme="light"] {
  --bg: #f5f5f0; --fg: #0a0a0a; --fg2: #222222; --fg3: #555555; --fg4: #999999;
  --bg2: #ebebe6; --card: #ffffff; --border: #d0d0c8; --border2: #e0e0d8;
  --primary: hsl(0, 85%, 40%); --primary-dim: hsl(0, 85%, 40%, 0.1); --primary-glow: hsl(0, 85%, 40%, 0.06);
  --secondary: #f0f0eb; --dante: #333333; --max-c: #666666; --ate: hsl(280, 65%, 45%);
  --desk-texture: #eaeae5;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-serif); transition: background 0.3s, color 0.3s; overflow: hidden; }
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); }

@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
@keyframes drawerIn { from{transform:translateX(-100%)} to{transform:translateX(0)} }

.fade-in { animation: fadeIn 0.6s ease both; }
.slide-down { animation: slideDown 0.5s cubic-bezier(0.23,1,0.32,1) both; }
.slide-up-anim { animation: slideUp 0.5s cubic-bezier(0.23,1,0.32,1) both; }
.cursor-blink { animation: blink 1s step-end infinite; }

.day-bar { position: fixed; top: 0; left: 0; height: 2px; z-index: 100; background: var(--primary); box-shadow: 0 0 8px var(--primary); transition: width 1s linear; }
.app-shell { display: flex; flex-direction: column; height: 100vh; }
.header { border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 10; background: var(--bg); }
.header-top { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1.25rem; border-bottom: 1px solid var(--border2); }
.clocks { display: flex; gap: 1.5rem; font-family: var(--font-mono); font-size: 0.5rem; color: var(--fg4); letter-spacing: 2px; text-transform: uppercase; }
.clock-item { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.clock-time { font-size: 0.7rem; color: var(--fg3); letter-spacing: 0.5px; }
.header-controls { display: flex; align-items: center; gap: 0.75rem; }
.fecha-display { font-family: var(--font-mono); font-size: 0.45rem; color: var(--fg4); letter-spacing: 2px; text-transform: uppercase; }
.greeting-display { font-family: var(--font-serif); font-size: 0.75rem; color: var(--fg3); font-style: italic; letter-spacing: 0.5px; }
.countdowns-zone { display: flex; justify-content: center; align-items: flex-end; gap: 0; padding: 1.25rem 1.25rem 0.75rem; position: relative; }
.countdown-block { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.25rem; padding: 0 1.5rem; position: relative; cursor: pointer; transition: opacity 0.2s; }
.countdown-block:hover { opacity: 0.8; }
.countdown-block + .countdown-block::before { content: ''; position: absolute; left: 0; top: 10%; height: 80%; width: 1px; background: var(--border); }
.countdown-number { font-family: var(--font-mono); font-size: clamp(2.5rem, 5vw, 4.5rem); font-weight: 700; color: var(--fg); letter-spacing: -2px; line-height: 1; transition: color 0.2s; }
.countdown-number.urgent { color: var(--primary); }
.countdown-label { font-family: var(--font-mono); font-size: 0.4rem; color: var(--fg4); letter-spacing: 4px; text-transform: uppercase; }
.countdown-unit { font-family: var(--font-mono); font-size: 0.38rem; color: var(--fg4); letter-spacing: 2px; }
.dialogue-strip { border-top: 1px solid var(--border2); padding: 0.4rem 1.25rem; display: flex; align-items: center; gap: 1rem; min-height: 1.8rem; cursor: pointer; }
.dia-max { font-family: var(--font-mono); font-size: 0.55rem; color: var(--max-c); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.dia-dante { font-family: var(--font-serif); font-size: 0.6rem; color: var(--dante); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: right; }
.dia-sep { width: 1px; height: 0.8rem; background: var(--border); flex-shrink: 0; }

.desk-layout { display: flex; flex: 1; overflow: hidden; background: var(--desk-texture); position: relative; }
.dock { width: 50px; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 0.5rem; gap: 0.25rem; z-index: 15; flex-shrink: 0; }
.dock-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; background: none; border: 1px solid transparent; color: var(--fg4); cursor: pointer; transition: all 0.2s; border-radius: 2px; }
.dock-btn:hover { border-color: var(--border); color: var(--fg2); background: var(--bg2); }
.dock-btn.active { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); }
.dock-spacer { flex: 1; }

.workspace { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 1.5rem; position: relative; align-items: center; }
.workspace::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: radial-gradient(var(--border2) 1px, transparent 1px); background-size: 20px 20px; opacity: 0.3; pointer-events: none; }
.pinboard { width: 240px; background: var(--bg); border-left: 1px solid var(--border); padding: 1rem 0.75rem; display: flex; flex-direction: column; gap: 1.5rem; overflow-y: auto; z-index: 5; flex-shrink: 0; }

.drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 20; animation: fadeIn 0.3s ease; }
.drawer-panel { position: fixed; top: 0; left: 50px; width: 380px; height: 100vh; background: var(--bg); border-right: 2px solid var(--border); z-index: 21; animation: drawerIn 0.4s cubic-bezier(0.23,1,0.32,1) both; overflow-y: auto; padding: 1.5rem; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }

.paper { background: var(--card); border: 1px solid var(--border); padding: 1.5rem; width: 100%; max-width: 650px; box-shadow: 2px 2px 8px rgba(0,0,0,0.4); position: relative; transition: box-shadow 0.2s, transform 0.2s; }
.paper:hover { box-shadow: 4px 4px 12px rgba(0,0,0,0.5); transform: translateY(-1px); z-index: 1; }
.note-card { border: 1px solid var(--border); padding: 0.5rem; cursor: pointer; transition: all 0.15s; background: var(--card); box-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
.note-card:nth-child(odd) { transform: rotate(-0.5deg); }
.note-card:nth-child(even) { transform: rotate(0.5deg); }
.note-card:hover { border-color: var(--primary); transform: rotate(0deg) scale(1.02); z-index: 2; }

.sec-label { font-family: var(--font-mono); font-size: 0.4rem; letter-spacing: 3px; text-transform: uppercase; color: var(--fg4); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
.sec-label::after { content:''; flex:1; height:1px; background:var(--border); }
.btn { background: transparent; border: 1px solid var(--border); color: var(--fg3); padding: 0.15rem 0.5rem; font-family: var(--font-mono); font-size: 0.5rem; letter-spacing: 1px; cursor: pointer; transition: all 0.15s; }
.btn:hover { color: var(--fg); border-color: var(--fg4); }
.btn.active { border-color: var(--primary); color: var(--fg); }
.inp { background: var(--secondary); border: 1px solid var(--border); color: var(--fg); font-family: var(--font-mono); font-size: 0.6rem; padding: 0.4rem 0.5rem; width: 100%; outline: none; transition: border-color 0.2s; }
.inp:focus { border-color: var(--primary); }
.inp-serif { font-family: var(--font-serif); font-size: 0.75rem; }
.inp-area { resize: vertical; min-height: 6rem; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; }
.modal-box { border: 1px solid var(--border); background: var(--card); padding: 1.5rem; width: 380px; max-width: 95vw; display: flex; flex-direction: column; gap: 0.75rem; animation: slideDown 0.3s ease both; }
.modal-title { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: var(--fg2); }
.modal-row { display:flex; gap:0.5rem; justify-content:flex-end; }
.tabs-row { display: flex; gap: 0.2rem; flex-wrap: wrap; margin-bottom: 1rem; }
.kpi { border-left: 2px solid var(--border); padding: 0.2rem 0.6rem; transition: border-color 0.2s; cursor: default; }
.kpi:hover { border-left-color: var(--primary); }
.kpi-val { display: block; font-family: var(--font-mono); font-size: 1.1rem; font-weight: 300; color: var(--fg); }
.kpi-lbl { font-family: var(--font-mono); font-size: 0.4rem; color: var(--fg4); letter-spacing: 1px; text-transform: uppercase; }
.dot { width: 6px; height: 6px; border-radius: 1px; transition: all 0.2s; }
.dot-active { background: var(--primary); box-shadow: 0 0 4px var(--primary); }
.dot-filled { background: rgba(180,30,30,0.45); }
.dot-empty { background: var(--border); }
.dot-row { display: flex; gap: 2px; flex-wrap: wrap; }
.diary-dot { width: 1.4rem; height: 1.4rem; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.42rem; cursor: pointer; transition: all 0.15s; border: 1px solid var(--border2); color: var(--fg4); }
.diary-dot.filled { background: var(--primary-dim); color: var(--fg3); }
.diary-dot.current { border-color: var(--primary); color: var(--fg); background: var(--primary-glow); }
.diary-dot:hover { border-color: var(--fg4); }
.theme-toggle { background: none; border: 1px solid var(--border); color: var(--fg4); font-family: var(--font-mono); font-size: 0.45rem; letter-spacing: 1px; padding: 0.15rem 0.4rem; cursor: pointer; transition: all 0.15s; text-transform: uppercase; }
.theme-toggle:hover { color: var(--fg); border-color: var(--fg4); }

footer { border-top: 1px solid var(--border); padding: 0.4rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; background: var(--bg); flex-shrink: 0; z-index: 10; }
.backup-notice { position: fixed; bottom: 1rem; right: 1rem; border: 1px solid hsl(140,50%,50%); background: var(--card); padding: 0.4rem 0.75rem; font-family: var(--font-mono); font-size: 0.5rem; color: hsl(140,50%,50%); z-index: 300; animation: fadeIn 0.3s ease both; }

@media(max-width: 1000px) { .pinboard { display: none; } .desk-layout { flex-direction: column; } .dock { width: 100%; height: 45px; flex-direction: row; border-right: none; border-bottom: 1px solid var(--border); padding: 0 0.5rem; overflow-x: auto; } .dock-spacer { display: none; } }
@media(max-width: 768px) { .workspace { padding: 0.75rem; } .paper { padding: 1rem; } .drawer-panel { width: 100%; left: 0; } }
</style>

const DB_NAME = 'AstraV8_Vault'; const STORE_NAME = 'core_memory'; let db = null;
async function initVault() { return new Promise((resolve, reject) => { const r = indexedDB.open(DB_NAME, 1); r.onupgradeneeded = (e) => { const d = e.target.result; if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME); }; r.onsuccess = (e) => { db = e.target.result; resolve(db); }; r.onerror = (e) => reject(e.target.error); }); }
async function requestPersistentStorage() { if (navigator.storage && navigator.storage.persist) { const g = await navigator.storage.persist(); if(g) console.log("VAULT: Persistencia concedida."); } }
async function syncToVault() { if (!db) await initVault(); const s = {}; BACKUP_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v) s[k] = v; }); return new Promise((resolve, reject) => { const tx = db.transaction(STORE_NAME, 'readwrite'); tx.objectStore(STORE_NAME).put(s, 'full_snapshot'); tx.oncomplete = () => resolve(true); tx.onerror = (e) => reject(e.target.error); }); }
async function restoreFromVault() { if (!db) await initVault(); return new Promise((resolve, reject) => { const tx = db.transaction(STORE_NAME, 'readonly'); const r = tx.objectStore(STORE_NAME).get('full_snapshot'); r.onsuccess = (e) => { const d = e.target.result; if (d) { Object.entries(d).forEach(([k, v]) => localStorage.setItem(k, v)); resolve(true); } else resolve(false); }; r.onerror = (e) => reject(e.target.error); }); }
async function checkVaultOnBoot() { await initVault(); await requestPersistentStorage(); if (!localStorage.getItem('astra_theme')) { const r = await restoreFromVault(); if (r) console.log("VAULT: Memoria resucitada."); } }

/* =============================================

const monthKeys = () => { const k=[]; const n=new Date(); for(let i=29;i>=0;i--) k.push(new Date(n-i*86400000).toISOString().split('T')[0]); return k; };
const BACKUP_KEYS = ['astra_notes','diario_data','contexto_events','tracker_data','pomodoroCount','pomodoroHistory','worker_url','iap_cache','hitos_data','lectura_data','presupuesto_data','correspondencia_data','countdown_parciales','countdown_sat','countdown_grad','astra_theme','ate_chat_log','ate_model_file','crono_anchor'];

  const hour = new Date().getHours();
  let greet = '';
  if (hour < 12) greet = ['Buenos días', 'Bom dia', 'Good morning'][Math.floor(Math.random()*3)];
  else if (hour < 18) greet = ['Buenas tardes', 'Boa tarde', 'Good afternoon'][Math.floor(Math.random()*3)];

  return `${greet}, ${NICKNAMES[Math.floor(Math.random() * NICKNAMES.length)]}`;
}

function useClocks() { const [c, setC] = useState({ bog: '--:--', nyc: '--:--' }); useEffect(() => { const u = () => { const n = new Date(), o = { hour:'2-digit', minute:'2-digit', hour12: false }; setC({ bog: n.toLocaleTimeString('es-CO', { ...o, timeZone:'America/Bogota' }), nyc: n.toLocaleTimeString('en-US', { ...o, timeZone:'America/New_York' }) }); }; u(); const id = setInterval(u, 1000); return () => clearInterval(id); }, []); return c; }
function useDayProgress() { const [p, setP] = useState(0); useEffect(() => { const u = () => { const n = new Date(); setP((n.getHours() * 60 + n.getMinutes()) / 1440 * 100); }; u(); const id = setInterval(u, 30000); return () => clearInterval(id); }, []); return p; }
function useCountdowns() { const [days, setDays] = useState({}); useEffect(() => { const u = () => { const n = new Date(); const sat = ls.get('countdown_sat', '2026-08-22'); const parciales = ls.get('countdown_parciales', ''); const grad = ls.get('countdown_grad', '2027-11-01'); const calc = d => d ? Math.max(0, Math.ceil((new Date(d) - n) / 86400000)) : null; setDays({ sat: calc(sat), parciales: parciales ? calc(parciales) : null, grad: calc(grad) }); }; u(); const id = setInterval(u, 3600000); return () => clearInterval(id); }, []); return days; }
function useDialogue() { const pick = () => { const day = new Date().getDay(); const pool = dialogosPorDia[day] ?? dialogosPorDia[0]; const seed = parseInt(todayKey().replace(/-/g, '')) % pool.length; return pool[seed]; }; const [d, setD] = useState(() => pick()); useEffect(() => { const midnight = new Date(); midnight.setHours(24, 0, 0, 0); const id = setTimeout(() => setD(pick()), midnight - new Date()); return () => clearTimeout(id); }, [d]); return d; }
function useGeoWeather() { const [loc, setLoc] = useState('⌖ Mosquera'); const [weather, setWeather] = useState(''); useEffect(() => { if (!navigator.geolocation) return; navigator.geolocation.getCurrentPosition(async pos => { const { latitude: lat, longitude: lon } = pos.coords; try { const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=es`); const d = await r.json(); setLoc(`⌖ ${d.locality || 'Región'}`); } catch {} try { const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`); const d = await r.json(); const t = Math.round(d.current.temperature_2m); const cs = ['Despejado','Parcialmente nublado','Niebla','Llovizna','Lluvia','Nieve','Aguacero','Nieve fuerte','Tormenta','Variable']; setWeather(`${t}°C · ${cs[Math.min(9, d.current.weather_code)]}`); } catch {} }, () => setLoc('⌖ Mosquera')); }, []); return { loc, weather }; }

function usePomodoro(logTrackerFn) {
  const [time, setTime] = useState(25 * 60); const [isWork, setIsWork] = useState(true); const [running, setRunning] = useState(false);
  const [count, setCount] = useState(() => parseInt(ls.get('pomodoroCount', '0'))); const [subject, setSubject] = useState('');
  useEffect(() => { if (!running) return; const id = setInterval(() => { setTime(p => { if (p <= 1) { setRunning(false); if (isWork) { const nc = count + 1; setCount(nc); ls.set('pomodoroCount', String(nc)); const h = ls.get('pomodoroHistory', []); h.push(new Date().toISOString()); ls.set('pomodoroHistory', h); if(subject && logTrackerFn) logTrackerFn(subject, 0.42); syncToVault(); setIsWork(false); return 5 * 60; } else { setIsWork(true); return 25 * 60; } } return p - 1; }); }, 1000); return () => clearInterval(id); }, [running, isWork, count, subject, logTrackerFn]);
  const m = Math.floor(time / 60), s = time % 60; const weekly = ls.get('pomodoroHistory', []).filter(d => new Date(d).getTime() >= Date.now() - 7 * 86400000).length;
  return { display: `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`, count, weekly, isWork, running, subject, setSubject, start: () => setRunning(true), pause: () => setRunning(false), reset: () => { setRunning(false); setIsWork(true); setTime(25 * 60); } };
}

const IAP_LEVELS = { A: { label:'A — Momentum óptimo', color:'#2f855a' }, B: { label:'B — Progreso estable', color:'#38a169' }, C: { label:'C — Operación normal', color:'#d69e2e' }, D: { label:'D — Atención elevada', color:'#dd6b20' }, E: { label:'E — Pérdida de tracción', color:'#c05621' }, F: { label:'F — Alerta crítica', color:'#b83257' }, G: { label:'G — Crisis operacional', color:'#9b2c2c' }, };
function calcMomentumLevel() { let score = 0; const month = monthKeys(); const tracker = ls.get('tracker_data', {}); const pomHistory = ls.get('pomodoroHistory', []); let streak = 0; for (let i = month.length - 1; i >= 0; i--) { if (tracker[month[i]] && Object.values(tracker[month[i]]).some(v => v > 0)) streak++; else if (streak > 0) break; } score += Math.min(30, streak * 3); const week = weekKeys(); const horasThis = week.reduce((t, k) => t + (tracker[k] ? Object.values(tracker[k]).reduce((a,b) => a+b, 0) : 0), 0); score += Math.min(25, horasThis * 4); const pomToday = pomHistory.filter(d => d.startsWith(todayKey())).length; score += Math.min(15, pomToday * 3); const satDate = ls.get('countdown_sat', '2026-08-22'); const diasSAT = Math.ceil((new Date(satDate) - new Date()) / 86400000); if (diasSAT < 90 && horasThis < 5) score -= 15; score = Math.max(0, Math.min(100, score)); if (score >= 80) return 'A'; if (score >= 65) return 'B'; if (score >= 50) return 'C'; if (score >= 38) return 'D'; if (score >= 25) return 'E'; if (score >= 12) return 'F'; return 'G'; }
function buildIAPContext() { const week = weekKeys(); const tracker = ls.get('tracker_data', {}); const pomHistory = ls.get('pomodoroHistory', []); const horasThis = week.reduce((t, k) => t + (tracker[k] ? Object.values(tracker[k]).reduce((a,b) => a+b, 0) : 0), 0); const pomToday = pomHistory.filter(d => d.startsWith(todayKey())).length; const satDate = ls.get('countdown_sat', '2026-08-22'); const diasSAT = Math.ceil((new Date(satDate) - new Date()) / 86400000); return `Horas estudio semana: ${horasThis.toFixed(1)}h | Pomodoros hoy: ${pomToday} | Días hasta SAT: ${diasSAT}`; }

const SPOTIFY_CLIENT_ID = '5ca64f221b95488e96e94a52e2313451'; const SPOTIFY_REDIRECT_URI = window.location.href.split('?')[0].split('#')[0]; const SPOTIFY_SCOPES = 'user-read-currently-playing user-read-playback-state';
async function pkceChallenge() { const arr = new Uint8Array(32); crypto.getRandomValues(arr); const verifier = btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); const enc = new TextEncoder().encode(verifier); const hash = await crypto.subtle.digest('SHA-256', enc); const challenge = btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); return { verifier, challenge }; }
async function spotifyLogin() { const { verifier, challenge } = await pkceChallenge(); sessionStorage.setItem('spotify_verifier', verifier); const params = new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, response_type: 'code', redirect_uri: SPOTIFY_REDIRECT_URI, scope: SPOTIFY_SCOPES, code_challenge_method: 'S256', code_challenge: challenge }); window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString(); }
async function exchangeCode(code) { const verifier = sessionStorage.getItem('spotify_verifier'); if (!verifier) return null; const res = await fetch('https://accounts.spotify.com/api/token', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, grant_type:'authorization_code', code, redirect_uri: SPOTIFY_REDIRECT_URI, code_verifier: verifier }) }); if (!res.ok) return null; const data = await res.json(); ls.set('spotify_token', data.access_token); ls.set('spotify_refresh', data.refresh_token); ls.set('spotify_exp', Date.now() + data.expires_in * 1000); sessionStorage.removeItem('spotify_verifier'); return data.access_token; }
async function refreshSpotify() { const rt = ls.get('spotify_refresh', null); if (!rt) return null; const res = await fetch('https://accounts.spotify.com/api/token', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, grant_type:'refresh_token', refresh_token: rt }) }); if (!res.ok) { ls.set('spotify_token', null); return null; } const data = await res.json(); ls.set('spotify_token', data.access_token); ls.set('spotify_exp', Date.now() + data.expires_in * 1000); if (data.refresh_token) ls.set('spotify_refresh', data.refresh_token); return data.access_token; }
async function getValidToken() { let token = ls.get('spotify_token', null); if (!token) return null; if (Date.now() > ls.get('spotify_exp', 0) - 60000) token = await refreshSpotify(); return token; }
async function fetchNowPlaying(token) { const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', { headers: { Authorization: 'Bearer ' + token } }); if (res.status === 204 || res.status === 404) return { idle: true }; if (!res.ok) return null; const data = await res.json(); if (!data || !data.item) return { idle: true }; return { title: data.item.name, artist: data.item.artists.map(a => a.name).join(', '), cover: data.item.album.images?.[2]?.url || null, playing: data.is_playing }; }

function getCycleDay(dateStr) { const anchorStr = ls.get('crono_anchor', '2024-08-12'); const anchor = new Date(anchorStr + 'T12:00:00'); const target = new Date(dateStr + 'T12:00:00'); let schoolDays = 0; let current = new Date(anchor); while(current <= target) { const dayOfWeek = current.getDay(); if (dayOfWeek !== 0 && dayOfWeek !== 6) { if (current.getTime() === target.getTime()) break; schoolDays++; } current.setDate(current.getDate() + 1); } return (schoolDays % 4) + 1; }

stifyContent: 'space-between', marginTop: '0.25rem' }}> <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.45rem', color: status === 'guardado' ? 'var(--primary)' : 'var(--fg4)' }}>{status}</span> <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.45rem', color: 'var(--fg4)' }}>{wc} palabras</span> </div> <div style={{ display: 'flex', gap: '0.25rem', marginTop: '0.75rem', flexWrap: 'wrap', justifyContent: 'center' }}> {dots.map(d => ( <div key={d.key} onClick={() => setKey(d.key)} className={`diary-dot${d.has ? ' filled' : ''}${d.isCurrent ? ' current' : ''}`}>{d.day}</div> ))} </div> </div> ); }
function ContextoTab() { const [events, setEvents] = useState(() => ls.get('contexto_events', CONTEXTO_DEFAULTS)); const [modal, setModal] = useState(false); const [editId, setEditId] = useState(null); const [form, setForm] = useState({ label: '', date: todayKey(), type: 'academic' }); const save = () => { if (!form.label || !form.date) return; let d = [...events]; if (editId) d = d.map(e => e.id === editId ? { ...e, ...form } : e); else d.push({ id: 'c' + Date.now(), ...form }); ls.set('contexto_events', d); setEvents(d); setModal(false); }; const del = id => { if (!confirm('¿Eliminar?')) return; const d = events.filter(e => e.id !== id); ls.set('contexto_events', d); setEvents(d); }; const now = new Date(); now.setHours(0,0,0,0); return ( <div style={{ width: '100%' }}> <div style={{ display: 'flex', alignItems: 'center', marginBottom: '0.5rem' }}><SecLabel>Próximos eventos</SecLabel><Btn onClick={() => { setEditId(null); setForm({ label: '', date: todayKey(), type: 'academic' }); setModal(true); }} style={{ marginLeft: 'auto', fontSize: '0.42rem' }}>+ Añadir</Btn></div> {[...events].sort((a, b) => new Date(a.date) - new Date(b.date)).map(ev => { const ed = new Date(ev.date + 'T12:00:00'); ed.setHours(0,0,0,0); const diff = Math.round((ed - now) / 86400000); return ( <div key={ev.id} style={{ display: 'flex', padding: '0.4rem 0', borderBottom: '1px solid var(--border2)' }}> <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.6rem', fontWeight: 'bold', minWidth: '2.5rem', color: diff <= 3 ? 'var(--primary)' : 'var(--fg3)' }}>{diff === 0 ? 'HOY' : diff < 0 ? `+${Math.abs(diff)}d` : `${diff}d`}</span> <div style={{ flex: 1 }}><div style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.6rem', color: diff < 0 ? 'var(--fg4)' : 'var(--fg2)' }}>{ev.label}</div></div> <button onClick={() => del(ev.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--fg4)', fontSize: '0.5rem' }}>×</button> </div> ); })} {modal && ( function AteChatTab() { const [mensaje, setMensaje] = useState(""); const [chatLog, setChatLog] = useState(() => ls.get('ate_chat_log', [])); const [loading, setLoading] = useState(false); const [atePrompt, setAtePrompt] = useState(() => ls.get('ate_model_file', DEFAULT_ATE_PROMPT)); const chatRef = useRef(null); const workerUrl = getWorkerUrl(); useEffect(() => { if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight; }, [chatLog]); const enviarAte = async () => { if (!mensaje.trim()) return; if (!workerUrl) { alert("Worker URL no configurada."); return; } const userText = mensaje; setMensaje(""); const newLog = [...chatLog, { rol: "Tomu", texto: userText }]; setChatLog(newLog); ls.set('ate_chat_log', newLog.slice(-70)); setLoading(true); try { const contents = chatLog.slice(-35).map(msg => ({ role: msg.rol === "Tomu" ? "user" : "model", parts: [{ text: msg.texto }] })); contents.push({ role: "user", parts: [{ text: userText }] }); const res = await fetch(workerUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ systemInstruction: { parts: [{ text: atePrompt }] }, contents: contents, generationConfig: { temperature: 0.9, topP: 0.95, maxOutputTokens: 2048 } }) }); const data = await res.json(); if (data.error) throw new Error(data.error.message); const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text || "0x0 — Ate guarda silencio."; const updated = [...newLog, { rol: "Ate", texto: responseText }]; setChatLog(updated); ls.set('ate_chat_log', updated.slice(-70)); syncToVault(); } catch (e) { const errLog = [...newLog, { rol: "Ate", texto: `[CRITICAL_FAILURE]: ${e.message}` }]; setChatLog(errLog); } setLoading(false); }; return ( <div style={{ display: 'flex', flexDirection: 'column', height: '65vh', gap: '0.5rem', width: '100%' }}> <div ref={chatRef} style={{ flex: 1, overflowY: 'auto', border: '1px solid var(--border)', padding: '0.75rem', display: 'flex', flexDirection: 'column', gap: '0.75rem', backgroundColor: 'var(--card)' }}> {chatLog.map((m, i) => ( <div key={i} style={{ alignSelf: m.rol === "Tomu" ? "flex-end" : "flex-start", maxWidth: '88%', border: `1px solid ${m.rol === "Tomu" ? "var(--primary)" : "var(--border)"}`, padding: '0.6rem 0.75rem', background: m.rol === "Tomu" ? 'var(--primary-glow)' : 'transparent' }}> <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.38rem', color: m.rol === 'Ate' ? 'var(--ate)' : 'var(--fg4)', marginBottom: '0.3rem', letterSpacing: '2px', textTransform: 'uppercase' }}>{m.rol}</div> <div style={{ fontFamily: m.rol === "Ate" ? 'var(--font-serif)' : 'var(--font-mono)', fontSize: '0.65rem', lineHeight: '1.6', whiteSpace: 'pre-wrap', color: 'var(--fg2)' }}>{m.texto}</div> </div> ))} {loading && <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)', animation: 'pulse 1.5s infinite' }}>Ate está procesando...</div>} </div> <div style={{ display: 'flex', gap: '0.5rem' }}> <textarea value={mensaje} onChange={(e) => setMensaje(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarAte(); } }} placeholder="Inyectar comando a Ate..." className="inp" style={{ flex: 1, height: '3rem', resize: 'none', fontSize: '0.6rem' }} /> <Btn onClick={enviarAte} disabled={loading} style={{ borderColor: 'var(--ate)', color: 'var(--ate)', minWidth: '3.5rem' }}>{loading ? '···' : 'Ejecutar'}</Btn> </div> </div> ); }

 && ( <Modal onClose={() => setModal(false)} title="Nuevo movimiento"> <input value={form.descripcion} onChange={e => setForm(f => ({ ...f, descripcion: e.target.value }))} placeholder="Descripción" className="inp" /> <input type="number" value={form.monto} onChange={e => setForm(f => ({ ...f, monto: e.target.value }))} placeholder="Monto" className="inp" /> <select value={form.tipo} onChange={e => setForm(f => ({ ...f, tipo: e.target.value }))} className="inp"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select> <div className="modal-row"><Btn onClick={() => setModal(false)}>Cancelar</Btn><Btn onClick={save} style={{ borderColor: 'var(--primary)' }}>Guardar</Btn></div> </Modal> )} </div> ); }
function CorrespondenciaTab() { const [data, setData] = useState(() => ls.get('correspondencia_data', [])); const [modal, setModal] = useState(false); const [form, setForm] = useState({ destinatario: '', asunto: '', fecha: todayKey(), estado: 'enviado' }); const save = () => { if (!form.destinatario || !form.asunto) return; const d = [{ ...form, id: Date.now() }, ...data]; ls.set('correspondencia_data', d); setData(d); syncToVault(); setModal(false); setForm({ destinatario: '', asunto: '', fecha: todayKey(), estado: 'enviado' }); }; const cycleStatus = id => { const order = ['enviado', 'esperando', 'respondido', 'archivado']; const d = data.map(c => c.id === id ? { ...c, estado: order[(order.indexOf(c.estado) + 1) % order.length] } : c); ls.set('correspondencia_data', d); setData(d); }; return ( <div> <div style={{ display: 'flex', alignItems: 'center', marginBottom: '0.75rem' }}><SecLabel>Correo</SecLabel><Btn onClick={() => setModal(true)} style={{ marginLeft: 'auto', fontSize: '0.42rem' }}>+ Añadir</Btn></div> {data.slice(0, 10).map(c => ( <div key={c.id} style={{ display: 'flex', alignItems: 'flex-start', gap: '0.5rem', padding: '0.4rem 0', borderBottom: '1px solid var(--border2)' }}> <div onClick={() => cycleStatus(c.id)} style={{ fontFamily: 'var(--font-mono)', fontSize: '0.38rem', padding: '0.1rem 0.3rem', border: '1px solid', cursor: 'pointer', color: c.estado === 'respondido' ? 'hsl(140,50%,50%)' : 'var(--fg4)', borderColor: c.estado === 'respondido' ? 'hsl(140,50%,50%,0.3)' : 'var(--border)' }}>{c.estado}</div> <div style={{ flex: 1 }}><div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.42rem', color: 'var(--fg4)' }}>{c.destinatario}</div><div style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.62rem', color: 'var(--fg2)' }}>{c.asunto}</div></div> </div> ))} {modal && ( <Modal onClose={() => setModal(false)} title="Nueva correspondencia"> <input value={form.destinatario} onChange={e => setForm(f => ({ ...f, destinatario: e.target.value }))} placeholder="Destinatario" className="inp" /> <input value={form.asunto} onChange={e => setForm(f => ({ ...f, asunto: e.target.value }))} placeholder="Asunto" className="inp" /> <div className="modal-row"><Btn onClick={() => setModal(false)}>Cancelar</Btn><Btn onClick={save} style={{ borderColor: 'var(--primary)' }}>Guardar</Btn></div> </Modal> )} </div> ); }
function CronoTab() { const [anchor, setAnchor] = useState(() => ls.get('crono_anchor', '2024-08-12')); const todayCycleDay = getCycleDay(todayKey()); const todayClasses = CICLO_LICEO[todayCycleDay] || []; const saveAnchor = (val) => { ls.set('crono_anchor', val); setAnchor(val); }; const upcoming = []; const d = new Date(); for(let i=1; i<=10; i++) { d.setDate(d.getDate() + 1); const dow = d.getDay(); if(dow !== 0 && dow !== 6) { const key = d.toISOString().split('T')[0]; upcoming.push({ date: key, day: getCycleDay(key), dayName: d.toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric' }) }); if(upcoming.length >= 5) break; } } return ( <div> <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}> <SecLabel>Cronograma Liceísta</SecLabel> <div style={{ display: 'flex', gap: '0.3rem', alignItems: 'center' }}> <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.38rem', color: 'var(--fg4)' }}>Día 1 inicio:</span> <input type="date" value={anchor} onChange={e => saveAnchor(e.target.value)} style={{ background: 'var(--secondary)', border: '1px solid var(--border)', color: 'var(--fg)', fontFamily: 'var(--font-mono)', fontSize: '0.4rem', padding: '0.2rem' }} /> </div> </div> <div style={{ border: '1px solid var(--primary)', background: 'var(--primary-glow)', padding: '1rem', marginBottom: '1.5rem', textAlign: 'center' }}> <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.4rem', color: 'var(--primary)', letterSpacing: '3px', marginBottom: '0.5rem' }}>HOY ES</div> <div style={{ fontFamily: 'var(--font-mono)', fontSize: '2rem', fontWeight: 700, color: 'var(--fg)', letterSpacing: '-1px' }}>DÍA {todayCycleDay}</div> </div> <SecLabel>Clases de hoy</SecLabel> <div style={{ marginBottom: '1.5rem' }}> {todayClasses.map((c, i) => ( <div key={i} style={{ display: 'flex', gap: '0.75rem', padding: '0.4rem 0', borderBottom: '1px solid var(--border2)' }}> <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.55rem', color: 'var(--primary)', minWidth: '3rem' }}>{c.hora}</span> <span style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.65rem', color: 'var(--fg2)' }}>{c.clase}</span> </div> ))} </div> <SecLabel>Próximos días</SecLabel> <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}> {upcoming.map(u => ( <div key={u.date} style={{ border: '1px solid var(--border)', padding: '0.4rem 0.6rem', textAlign: 'center' }}> <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.4rem', color: 'var(--fg4)', textTransform: 'uppercase' }}>{u.dayName}</div> <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.8rem', fontWeight: 700, color: 'var(--fg2)' }}>D{u.day}</div> </div> ))} </div> </div> ); }

/* =============================================
   PINBOARD (Right Side)
   =============================================*/
function IAPMonitor() { const [level, setLevel] = useState(() => ls.get('iap_cache_level', 'C')); const [text, setText] = useState(() => ls.get('iap_cache_text', '')); const [loading, setLoading] = useState(false); const workerUrl = getWorkerUrl(); const iapLevel = IAP_LEVELS[level] || IAP_LEVELS['C']; const recalculate = useCallback(async () => { const newLevel = calcMomentumLevel(); setLevel(newLevel); ls.set('iap_cache_level', newLevel); if (!workerUrl) { setText('Worker URL no configurada.'); return; } setLoading(true); try { const ctx = buildIAPContext(); const prompt = `Contexto operacional Astra:\n${ctx}\nNivel ${newLevel} (${iapLevel.label}). Diagnóstico y acción urgente en 2 líneas.`; const res = await fetch(workerUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.3, maxOutputTokens: 150 } }) }); const data = await res.json(); const t = data.candidates?.[0]?.content?.parts?.[0]?.text || ''; setText(t.trim()); ls.set('iap_cache_text', t.trim()); } catch (e) { setText('Error de conexión.'); } setLoading(false); }, [workerUrl]); useEffect(() => { recalculate(); const id = setInterval(() => recalculate(), 1800000); return () => clearInterval(id); }, [recalculate]); return ( <div style={{ border: '1px solid var(--border)', padding: '0.75rem', position: 'relative', overflow: 'hidden' }}> <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: '2px', background: iapLevel.color, opacity: 0.6 }}></div> <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.5rem' }}> <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.38rem', color: 'var(--fg4)', letterSpacing: '3px', textTransform: 'uppercase' }}>Monitor IAP</div> <Btn onClick={() => recalculate()} style={{ fontSize: '0.38rem', padding: '0.1rem 0.3rem' }}>↺</Btn> </div> <div style={{ display: 'inline-flex', alignItems: 'center', gap: '0.4rem', fontFamily: 'var(--font-mono)', fontSize: '0.5rem', letterSpacing: '2px', textTransform: 'uppercase', padding: '0.15rem 0.5rem', border: `1px solid ${iapLevel.color}`, color: iapLevel.color, marginBottom: '0.5rem' }}> <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: iapLevel.color, display: 'inline-block' }} /> {iapLevel.label} </div> {loading ? <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.5rem', color: 'var(--fg4)', animation: 'pulse 1.5s infinite' }}>Calculando...</div> : <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.55rem', lineHeight: '1.7', color: 'var(--fg3)', marginTop: '0.5rem' }}>{text || 'Sin diagnóstico.'}</div>} </div> ); }
function SpotifyMini() { const [track, setTrack] = useState(null); const [authed, setAuthed] = useState(false); useEffect(() => { const params = new URLSearchParams(window.location.search); const code = params.get('code'); if (code) { exchangeCode(code).then(token => { window.history.replaceState({}, '', window.location.pathname); if (token) setAuthed(true); }); } else { getValidToken().then(t => { if (t) setAuthed(true); }); } }, []); useEffect(() => { if (!authed) return; const poll = async () => { const token = await getValidToken(); if (!token) { setAuthed(false); return; } const t = await fetchNowPlaying(token); setTrack(t); }; poll(); const id = setInterval(poll, 5000); return () => clearInterval(id); }, [authed]); if (!authed) return <button onClick={spotifyLogin} style={{ background: 'none', border: '1px solid #1DB954', color: '#1DB954', fontFamily: 'var(--font-mono)', fontSize: '0.45rem', padding: '0.2rem 0.4rem', cursor: 'pointer', width: '100%', letterSpacing: '1px' }}>▶ Spotify</button>; if (!track || track.idle) return <div style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.6rem', color: 'var(--fg4)' }}>Nada suena</div>; const comment = getMusicComment(track.title || '', track.artist || ''); return ( <div> <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', marginBottom: '0.3rem' }}> {track.cover ? <img src={track.cover} alt="cover" style={{ width: '1.5rem', height: '1.5rem', objectFit: 'cover', border: '1px solid var(--border)' }} /> : null} <div style={{ flex: 1, minWidth: 0 }}> <div style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: '0.6rem', color: 'var(--fg2)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{track.title}</div> </div> </div> {comment && <div style={{ fontFamily: 'var(--font-mono)', fontStyle: 'italic', fontSize: '0.45rem', lineHeight: '1.4', color: 'var(--max-c)', marginTop: '0.3rem' }}>{comment.max}</div>} </div> ); }

/* =============================================
   APP ROOT
   =============================================*/
function App() {
  const [theme, setTheme] = useState(() => ls.get('astra_theme', 'dark'));
  const [activeTab, setActiveTab] = useState('diario');
  const [activeDrawer, setActiveDrawer] = useState(null);
  const logTrackerFn = useCallback((subject, hours) => { const d = ls.get('tracker_data', {}); const tk = todayKey(); if (!d[tk]) d[tk] = {}; d[tk][subject] = (d[tk][subject] || 0) + hours; ls.set('tracker_data', d); }, []);
  const pom = usePomodoro(logTrackerFn);

  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); ls.set('astra_theme', theme); }, [theme]);
  useEffect(() => { checkVaultOnBoot(); const autoSync = setInterval(() => syncToVault(), 300000); return () => clearInterval(autoSync); }, []);

  const drawerContent = { crono: <CronoTab />, lectura: <LecturaTab />, presupuesto: <PresupuestoTab />, correspondencia: <CorrespondenciaTab />, acervo: <AcervoTab /> };
  const workspaceContent = { contexto: <ContextoTab />, diario: <DiarioTab />, tracker: <TrackerTab />, notas: <NotesTab />, horario: <HorarioTab />, ate: <AteChatTab /> };

  return (
    <ThemeCtx.Provider value={theme}>
      <div className="app-shell">
        <Header theme={theme} onToggleTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} />
        <div className="desk-layout">
          <div className="dock">
            <button className={`dock-btn ${activeDrawer === 'crono' ? 'active' : ''}`} onClick={() => setActiveDrawer(activeDrawer === 'crono' ? null : 'crono')} title="Cronograma">🔄</button>
            <button className={`dock-btn ${activeDrawer === 'lectura' ? 'active' : ''}`} onClick={() => setActiveDrawer(activeDrawer === 'lectura' ? null : 'lectura')} title="Biblioteca">📖</button>
            <button className={`dock-btn ${activeDrawer === 'presupuesto' ? 'active' : ''}`} onClick={() => setActiveDrawer(activeDrawer === 'presupuesto' ? null : 'presupuesto')} title="Presupuesto">💰</button>
            <button className={`dock-btn ${activeDrawer === 'correspondencia' ? 'active' : ''}`} onClick={() => setActiveDrawer(activeDrawer === 'correspondencia' ? null : 'correspondencia')} title="Correo">✉️</button>
            <button className={`dock-btn ${activeDrawer === 'acervo' ? 'active' : ''}`} onClick={() => setActiveDrawer(activeDrawer === 'acervo' ? null : 'acervo')} title="Acervo">📜</button>
            <div className="dock-spacer"></div>
          </div>

          {activeDrawer && ( <> <div className="drawer-overlay" onClick={() => setActiveDrawer(null)}></div> <div className="drawer-panel"> <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}> <SecLabel>{activeDrawer.charAt(0).toUpperCase() + activeDrawer.slice(1)}</SecLabel> <Btn onClick={() => setActiveDrawer(null)}>✕ Cerrar</Btn> </div> {drawerContent[activeDrawer]} </div> </> )}

          <div className="workspace">
            <div className="tabs-row">
              {Object.keys(workspaceContent).map(tab => <Btn key={tab} active={activeTab === tab} onClick={() => setActiveTab(tab)} style={{ fontSize: '0.45rem', borderColor: tab === 'ate' && activeTab === 'ate' ? 'var(--ate)' : undefined, color: tab === 'ate' && activeTab === 'ate' ? 'var(--ate)' : undefined }}>{tab.charAt(0).toUpperCase() + tab.slice(1)}</Btn>)}
            </div>
            <div className="paper fade-in" key={activeTab}>
              {workspaceContent[activeTab]}
            </div>
          </div>

          <div className="pinboard">
            <div className="slide-up-anim" style={{ animationDelay: '0.1s' }}><IAPMonitor /></div>
            <div className="slide-up-anim" style={{ animationDelay: '0.15s' }}>
              <SecLabel>Pomodoro</SecLabel>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: '1.8rem', letterSpacing: '1px', marginBottom: '0.3rem', color: pom.running ? 'var(--primary)' : 'var(--fg)' }}>{pom.display}</div>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.4rem', color: 'var(--fg4)', marginBottom: '0.3rem', letterSpacing: '1px' }}>{pom.isWork ? 'TRABAJO' : 'DESCANSO'}</div>
              <select value={pom.subject} onChange={e => pom.setSubject(e.target.value)} className="inp" style={{ marginBottom: '0.3rem', fontSize: '0.45rem' }}>
                <option value="">Sin materia</option>
                {Object.values(SUBJECTS).flat().map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <div style={{ display: 'flex', gap: '0.2rem', marginBottom: '0.4rem' }}> <Btn onClick={pom.start} active={pom.running}>▶</Btn><Btn onClick={pom.pause}>⏸</Btn><Btn onClick={pom.reset}>↺</Btn> </div>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.45rem', color: 'var(--fg4)' }}>Hoy: {pom.count} · Semana: {pom.weekly}</div>
            </div>
            <div className="slide-up-anim" style={{ animationDelay: '0.2s' }}>
              <SecLabel>Spotify</SecLabel>
              <SpotifyMini />
            </div>
          </div>
        </div>

        <footer>
          <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap', alignItems: 'center' }}>
            <button className="theme-toggle" onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}>{theme === 'dark' ? '○ Claro' : '● Oscuro'}</button>
            <Btn onClick={() => { const url = prompt("Worker URL:", getWorkerUrl()); if(url) { localStorage.setItem('worker_url', url); window.location.reload(); } }} style={{ fontSize: '0.4rem' }}>🔑 Worker</Btn>
          </div>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.38rem', color: 'var(--fg4)', letterSpacing: '2px', display:'flex', alignItems:'center', gap:'0.5rem' }}>
            <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: 'hsl(140,50%,50%)', display: 'inline-block' }}></span> VAULT ACTIVE · ASTRA V8
          </div>
        </footer>
      </div>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
