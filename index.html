<style>
:root {
  --background: #000;
  --foreground: #fff;
  --fg-secondary: #ccc;
  --muted: #888;
  --muted-dim: #555;
  --card: #0a0a0a;
  --primary: hsl(0,56%,23%);
  --primary-glow: hsl(0,56%,23%,0.18);
  --secondary: #141414;
  --border: #1f1f1f;
  --border-soft: #161616;
  --destructive: hsl(0,60%,50%);
  --dante: #aaa;
  --max-color: #848a84;
  --radius: 0px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: 'Libre Baskerville', Georgia, serif;
  background-image:
    radial-gradient(ellipse at 15% 50%, hsl(0 56% 23% / 0.04) 0%, transparent 60%),
    radial-gradient(ellipse at 85% 20%, hsl(213 38% 16% / 0.03) 0%, transparent 50%);
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted-dim); }

@keyframes fadeBlur { from { opacity:0; filter:blur(4px); } to { opacity:1; filter:blur(0); } }
@keyframes slideUp { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeReveal { from { opacity:0; clip-path:polygon(0 0,0 0,0 100%,0 100%); } to { opacity:1; clip-path:polygon(0 0,100% 0,100% 100%,0 100%); } }
@keyframes pulseDot { 0%,100%{opacity:.2;transform:scale(1);} 50%{opacity:.8;transform:scale(1.2);} }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

.fade-blur { animation: fadeBlur 0.8s cubic-bezier(0.23,1,0.32,1) both; }
.slide-up { animation: slideUp 0.6s cubic-bezier(0.23,1,0.32,1) both; }
.fade-reveal { animation: fadeReveal 0.8s cubic-bezier(0.23,1,0.32,1) both; }
.pulse-dot { animation: pulseDot 3s infinite; }
.cursor-blink { animation: blink 1s step-end infinite; }
.fade-in { animation: fadeIn 0.8s ease both; }

/* layout */
.dashboard { display:flex; flex-direction:column; min-height:100vh; }
.main-grid { display:grid; grid-template-columns: minmax(220px,260px) 1fr minmax(220px,280px); min-height:calc(100vh - 200px); border-top:1px solid var(--border); margin:0 auto; width:100%; max-width:1400px; }
@media(max-width:900px){
  .main-grid { grid-template-columns: 1fr; }
  .left-col, .right-col { border-right:none; border-bottom:1px solid var(--border); max-width:100%; min-width:0; }
}
.left-col { border-right:1px solid var(--border); padding:1rem 0.75rem; display:flex; flex-direction:column; gap:1rem; min-width:220px; max-width:260px; }
.center-col { border-right:1px solid var(--border); padding:1rem; display:flex; flex-direction:column; align-items:center; gap:0.75rem; flex:1; }
.right-col { padding:1rem 0.75rem; display:flex; flex-direction:column; gap:1rem; min-width:220px; max-width:280px; }

.mono { font-family:'JetBrains Mono',monospace; }
.serif { font-family:'Libre Baskerville',serif; }
.text-xs { font-size:0.55rem; }
.text-sm { font-size:0.65rem; }
.text-base { font-size:0.8rem; }
.text-lg { font-size:1rem; }
.text-xl { font-size:1.2rem; }
.text-2xl { font-size:1.5rem; }
.text-3xl { font-size:2.2rem; }
.text-4xl { font-size:2.5rem; }

.text-fg-secondary { color:var(--fg-secondary); }
.text-muted { color:var(--muted); }
.text-muted-dim { color:var(--muted-dim); }
.text-primary { color:var(--primary); }
.text-destructive { color:var(--destructive); }
.text-dante { color:var(--dante); }
.text-max { color:var(--max-color); }
.text-foreground { color:var(--foreground); }

.tracking-wide { letter-spacing:2px; }
.tracking-wider { letter-spacing:3px; }
.uppercase { text-transform:uppercase; }
.italic { font-style:italic; }

/* section label */
.section-label { font-family:'JetBrains Mono',monospace; font-size:0.45rem; letter-spacing:3px; text-transform:uppercase; color:var(--muted-dim); margin-bottom:0.375rem; display:flex; align-items:center; gap:0.375rem; }

/* astra button */
.astra-btn {
  background:transparent; border:1px solid var(--border); color:var(--fg-secondary);
  padding:0.125rem 0.5rem; font-family:'JetBrains Mono',monospace; font-size:0.55rem;
  letter-spacing:1px; cursor:pointer; transition:all 0.15s; position:relative;
  overflow:hidden;
}
.astra-btn:hover { color:var(--foreground); border-color:var(--muted-dim); transform:translateY(-1px); }
.astra-btn.active { border-color:var(--primary); color:var(--foreground); }

/* input / textarea / select */
.astra-input {
  background:var(--secondary); border:1px solid var(--border); color:var(--foreground);

.astra-input:focus { border-color:var(--primary); }
.astra-textarea { resize:none; height:10rem; font-family:'Libre Baskerville',serif; font-size:0.8rem; }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(4px); z-index:50; display:flex; align-items:center; justify-content:center; }
.modal-box { border:1px solid var(--border); background:var(--card); padding:1.5rem; width:300px; display:flex; flex-direction:column; gap:0.75rem; }
.modal-box h3 { font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:2px; text-transform:uppercase; }

/* progress line */
.horizon-row { display:flex; justify-content:space-between; align-items:baseline; padding:0.125rem 0; border-bottom:1px solid var(--border-soft); transition:all 0.15s; }
.horizon-row:hover { border-bottom-color:var(--primary); transform:translateX(2px); }

/* table */
.astra-table { font-family:'JetBrains Mono',monospace; font-size:0.5rem; width:100%; border-collapse:collapse; }
.astra-table th, .astra-table td { padding:0.25rem; border:1px solid var(--border-soft); }

.astra-table tr:hover { background:rgba(255,255,255,0.02); }

.dot-row { display:flex; gap:2px; flex-wrap:wrap; }

.dot-filled { background:rgba(139,30,30,0.5); }

.cal-wrap { border:1px solid var(--border); overflow:hidden; filter:invert(1) hue-rotate(180deg) brightness(0.8); }

/* note card */
.note-card { border:1px solid var(--border); padding:0.625rem; cursor:pointer; transition:all 0.15s; }
.note-card:hover { border-color:var(--primary); transform:translateY(-2px); }

/* shortcuts */
.shortcut-link { text-decoration:none; color:var(--muted-dim); font-family:'JetBrains Mono',monospace; font-size:0.5rem; text-transform:uppercase; letter-spacing:1px; padding:0.125rem 0.5rem; border:1px solid transparent; transition:all 0.15s; }
.shortcut-link:hover { color:var(--foreground); border-color:var(--border); transform:translateY(-1px); }

/* search form */
.search-form { display:flex; align-items:center; gap:0.5rem; }
.search-input { background:transparent; border:1px solid var(--border); color:var(--foreground); font-family:'Libre Baskerville',serif; font-size:0.7rem; padding:0.375rem 0.75rem; width:12rem; outline:none; transition:border-color 0.2s; }
.search-input::placeholder { color:rgba(85,85,85,0.6); }
.search-input:focus { border-color:var(--primary); }

/* tabs */
.tabs-row { display:flex; gap:0.25rem; flex-wrap:wrap; justify-content:center; }

/* meta progress bar */
.meta-bar { height:1px; background:var(--border); position:relative; margin-top:2px; }

/* diary dots */
.diary-dot { width:1.5rem; height:1.5rem; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:0.45rem; cursor:pointer; transition:all 0.15s; border:1px solid var(--border-soft); color:var(--muted-dim); }
.diary-dot.filled { background:rgba(139,30,30,0.08); color:var(--fg-secondary); }
.diary-dot.current { border-color:var(--primary); color:var(--foreground); background:rgba(139,30,30,0.12); }

/* header */
header { display:flex; flex-direction:column; align-items:center; padding:1.25rem 1rem 0.75rem; gap:0.25rem; }

/* progress bar fixed */
.day-bar { position:fixed; top:0; left:0; height:2px; z-index:50; background:linear-gradient(to right, transparent, rgba(139,30,30,0.5), rgba(139,30,30,0.2)); box-shadow:0 0 10px rgba(139,30,30,0.3); transition:width 1s cubic-bezier(0.23,1,0.32,1); }

/* footer */
footer { border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0.625rem 1rem; gap:0.75rem; flex-wrap:wrap; margin-top:auto; }

/* world clocks */

.clock-item { display:flex; flex-direction:column; align-items:center; gap:2px; cursor:default; }
.clock-time { font-size:0.8rem; color:var(--fg-secondary); letter-spacing:0.5px; }

/* greeting */
.greeting { font-size:2.5rem; font-family:'Libre Baskerville',serif; color:var(--foreground); letter-spacing:-0.5px; white-space:nowrap; }
.greeting-name { font-style:italic; background:linear-gradient(135deg, #fff 30%, #888); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

.dia-max { font-size:0.65rem; font-style:italic; color:var(--max-color); font-family:'JetBrains Mono',monospace; min-height:1.3em; }

/* tracker heatmap */
.heat-dot { width:6px; height:6px; border-radius:2px; }
.heat-on { background:rgba(139,30,30,0.7); }

.kpi-block { border-left:1px solid var(--border); padding:0.25rem 0.75rem; transition:all 0.15s; }

/* hub label */
.hub-label { font-family:'JetBrains Mono',monospace; font-size:0.4rem; letter-spacing:6px; color:rgba(85,85,85,0.2); margin:0.75rem 0; }

   BACKUP AUTOMÁTICO (servidor Debian)
   ========================================= */
const BACKUP_CONFIG = {
  serverUrl: 'http://192.168.1.15:5000', // ← CAMBIA ESTA IP POR LA DE TU SERVIDOR
  secretKey: 'GilbertDuMontier_MarquisDeLafayette1312#',
  autoBackup: true,
  lastBackup: localStorage.getItem('lastBackup') || null
};

async function generarToken(data) {
  const encoder = new TextEncoder();
  const key = await crypto.subtle.importKey(
    'raw',
    encoder.encode(BACKUP_CONFIG.secretKey),
    { name: 'HMAC', hash: 'SHA-256' },
    false,
    ['sign']
  );
  const jsonString = typeof data === 'string' ? data : JSON.stringify(data, Object.keys(data).sort());
  const signature = await crypto.subtle.sign('HMAC', key, encoder.encode(jsonString));
  return Array.from(new Uint8Array(signature)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function collectAllData() {
  // Recolecta todo lo que hay en localStorage
  const snapshot = {};
  const keys = [
    'astra_notes', 'diario_data', 'contexto_events',
    'tracker_data', 'pomodoroCount', 'pomodoroHistory',
    'gcal_url', 'public_mode'
  ];
  keys.forEach(k => {
    const v = localStorage.getItem(k);
    if (v) snapshot[k] = v;
  });
  return {
    timestamp: new Date().toISOString(),
    type: 'manual',
    version: '2.0',
    data: snapshot
  };
}

async function createBackup(type = 'manual') {
  const data = collectAllData();
  data.type = type;
  try {
    const token = await generarToken(JSON.stringify(data, Object.keys(data).sort()));
    const response = await fetch(`${BACKUP_CONFIG.serverUrl}/backup`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Backup-Token': token
      },
      body: JSON.stringify(data)
    });
    const result = await response.json();
    if (result.status === 'success') {
      const now = new Date().toISOString();
      localStorage.setItem('lastBackup', now);
      BACKUP_CONFIG.lastBackup = now;
      return { ok: true, msg: '✅ Backup completado en servidor' };
    } else {
      throw new Error(result.message || 'Error en servidor');
    }
  } catch (err) {
    console.error(err);
    return { ok: false, msg: '❌ Error al conectar con servidor' };
  }
}

function checkAndRunAutoBackup() {
  if (!BACKUP_CONFIG.autoBackup) return;
  const last = BACKUP_CONFIG.lastBackup;
  if (!last) {
    setTimeout(() => createBackup('automatic'), 5000);
    return;
  }
  const days = Math.floor((Date.now() - new Date(last)) / (1000 * 60 * 60 * 24));
  if (days >= 7) {
    setTimeout(() => createBackup('automatic'), 5000);
  }
}

function useClocks() {
  const [c, setC] = useState({nyc:'--:--', tky:'--:--', bog:'--:--'});
  useEffect(() => {
    const u = () => {
      const n = new Date(), o = {hour:'2-digit',minute:'2-digit',hour12:false};
      setC({
        nyc: n.toLocaleTimeString('en-US',{...o,timeZone:'America/New_York'}),
        tky: n.toLocaleTimeString('en-US',{...o,timeZone:'Asia/Tokyo'}),
        bog: n.toLocaleTimeString('es-CO',{...o,timeZone:'America/Bogota'}),
      });
    };
    u(); const id=setInterval(u,1000); return ()=>clearInterval(id);
  },[]);
  return c;
}

function useDayProgress() {
  const [p, setP] = useState(0);
  useEffect(() => {
    const u=()=>{const n=new Date();setP((n.getHours()*60+n.getMinutes())/1440*100);};
    u(); const id=setInterval(u,30000); return ()=>clearInterval(id);
  },[]);
  return p;
}

function useGreeting(pub) {
  const pick = (pub) => {
    const h=new Date().getHours();
    let pool = pub ? saludos.filter(s=>s.public) : saludos;
    pool = (h>=18||h<5) ? pool : pool.filter(s=>!s.saludo.match(/noches|noite|evening/));
    if(!pool.length) pool = saludos.filter(s=>s.public);
    return pool[Math.floor(Math.random()*pool.length)];
  };
  const [g, setG] = useState(()=>pick(pub));
  useEffect(()=>{const id=setInterval(()=>setG(pick(pub)),8000);return()=>clearInterval(id);},[pub]);
  return g;
}

function usePomodoro() {
  const [time, setTime] = useState(25*60);
  const [isWork, setIsWork] = useState(true);
  const [running, setRunning] = useState(false);
  const [count, setCount] = useState(()=>parseInt(ls.get('pomodoroCount','0')));
  const [weekly, setWeekly] = useState(0);
  const [monthly, setMonthly] = useState(0);

  const updateStats = useCallback(()=>{
    const h = ls.get('pomodoroHistory',[]);
    const n=new Date();
    setWeekly(h.filter(d=>new Date(d)>=new Date(n-7*86400000)).length);
    setMonthly(h.filter(d=>new Date(d)>=new Date(n-30*86400000)).length);
  },[]);

  useEffect(()=>{updateStats();},[]);

  useEffect(()=>{
    if(!running) return;
    const id=setInterval(()=>{
      setTime(p=>{
        if(p<=1){
          setRunning(false);
          if(isWork){
            const nc=count+1; setCount(nc); ls.set('pomodoroCount',String(nc));
            const h=ls.get('pomodoroHistory',[]); h.push(new Date().toDateString()); ls.set('pomodoroHistory',h);
            updateStats(); setIsWork(false); return 5*60;
          } else { setIsWork(true); return 25*60; }
        }
        return p-1;
      });
    },1000);
    return ()=>clearInterval(id);
  },[running,isWork,count]);

  const m=Math.floor(time/60), s=time%60;
  return {
    display:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`,
    count, weekly, monthly, isWork,
    start:()=>setRunning(true),
    pause:()=>setRunning(false),
    reset:()=>{setRunning(false);setIsWork(true);setTime(25*60);},
  };
}

function useGeoWeather() {
  const [loc, setLoc] = useState('⌖ Mosquera, Cundinamarca');
  const [weather, setWeather] = useState('');
  useEffect(()=>{
    if(!navigator.geolocation){return;}
    navigator.geolocation.getCurrentPosition(async pos=>{
      const {latitude:lat,longitude:lon}=pos.coords;
      try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=es`);const d=await r.json();setLoc(`⌖ ${d.locality||d.city||'Región desconocida'}`);}catch{}
      try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`);const d=await r.json();const t=Math.round(d.current.temperature_2m);const cs=['Despejado','Parcialmente nublado','Niebla','Llovizna','Lluvia','Nieve','Aguacero','Nieve fuerte','Tormenta','Variable'];setWeather(`${t}°C · ${cs[Math.min(9,d.current.weather_code)]}`);}catch{}
    },()=>setLoc('⌖ Mosquera, Cundinamarca'));
  },[]);
  return {loc,weather};
}

const SPOTIFY_CLIENT_ID = '5ca64f221b95488e96e94a52e2313451';
const SPOTIFY_REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];
const SPOTIFY_SCOPES = 'user-read-currently-playing user-read-playback-state';

async function pkceChallenge() {
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  const verifier = btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  const enc = new TextEncoder().encode(verifier);
  const hash = await crypto.subtle.digest('SHA-256', enc);
  const challenge = btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  return { verifier, challenge };
}

async function spotifyLogin() {
  const { verifier, challenge } = await pkceChallenge();
  sessionStorage.setItem('spotify_verifier', verifier);
  const params = new URLSearchParams({
    client_id: SPOTIFY_CLIENT_ID,
    response_type: 'code',
    redirect_uri: SPOTIFY_REDIRECT_URI,
    scope: SPOTIFY_SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge,
  });
  window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}

async function exchangeCode(code) {
  const verifier = sessionStorage.getItem('spotify_verifier');
  if (!verifier) return null;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: SPOTIFY_CLIENT_ID,
      grant_type: 'authorization_code',
      code,
      redirect_uri: SPOTIFY_REDIRECT_URI,
      code_verifier: verifier,
    }),
  });
  if (!res.ok) return null;
  const data = await res.json();
  const exp = Date.now() + data.expires_in * 1000;
  ls.set('spotify_token', data.access_token);
  ls.set('spotify_refresh', data.refresh_token);
  ls.set('spotify_exp', exp);
  sessionStorage.removeItem('spotify_verifier');
  return data.access_token;
}

async function refreshToken() {
  const rt = ls.get('spotify_refresh', null);
  if (!rt) return null;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: SPOTIFY_CLIENT_ID,
      grant_type: 'refresh_token',
      refresh_token: rt,
    }),
  });
  if (!res.ok) { ls.set('spotify_token',null); return null; }
  const data = await res.json();
  const exp = Date.now() + data.expires_in * 1000;
  ls.set('spotify_token', data.access_token);
  ls.set('spotify_exp', exp);
  if (data.refresh_token) ls.set('spotify_refresh', data.refresh_token);
  return data.access_token;
}

async function getValidToken() {
  const exp = ls.get('spotify_exp', 0);
  let token = ls.get('spotify_token', null);
  if (!token) return null;
  if (Date.now() > exp - 60000) token = await refreshToken();
  return token;
}

async function fetchNowPlaying(token) {
  const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
    headers: { Authorization: 'Bearer ' + token },
  });
  if (res.status === 204 || res.status === 404) return { idle: true };
  if (!res.ok) return null;
  const data = await res.json();
  if (!data || !data.item) return { idle: true };
  return {
    title: data.item.name,
    artist: data.item.artists.map(a => a.name).join(', '),
    album: data.item.album.name,
    cover: data.item.album.images?.[2]?.url || data.item.album.images?.[0]?.url || null,
    playing: data.is_playing,
    progress: data.progress_ms,
    duration: data.item.duration_ms,
  };
}

function SpotifyZone() {
  const [track, setTrack] = useState(null);
  const [loading, setLoading] = useState(false);
  const [authed, setAuthed] = useState(false);

  // Handle OAuth callback
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      setLoading(true);
      exchangeCode(code).then(token => {
        window.history.replaceState({}, '', window.location.pathname);
        if (token) setAuthed(true);
        setLoading(false);
      });
    } else {
      getValidToken().then(t => { if (t) setAuthed(true); });
    }
  }, []);

  // Poll now playing
  useEffect(() => {
    if (!authed) return;
    const poll = async () => {
      const token = await getValidToken();
      if (!token) { setAuthed(false); return; }
      const t = await fetchNowPlaying(token);
      setTrack(t);
    };
    poll();
    const id = setInterval(poll, 5000);
    return () => clearInterval(id);
  }, [authed]);

  const logout = () => {
    ls.set('spotify_token', null);
    ls.set('spotify_refresh', null);
    ls.set('spotify_exp', 0);
    setAuthed(false);
    setTrack(null);
  };

  const pct = track && !track.idle && track.duration ? Math.round(track.progress / track.duration * 100) : 0;

  return (
    <div className="spotify-box">
      <SectionLabel>Ahora suena</SectionLabel>
      {loading && (
        <div className="mono text-muted-dim" style={{fontSize:'0.55rem'}}>Conectando...</div>
      )}
      {!loading && !authed && (
        <button onClick={spotifyLogin} style={{background:'none',border:'1px solid #1DB954',color:'#1DB954',fontFamily:'JetBrains Mono,monospace',fontSize:'0.55rem',padding:'0.25rem 0.75rem',cursor:'pointer',letterSpacing:'1px',transition:'all 0.2s',width:'100%'}}>
          ▶ Conectar Spotify
        </button>
      )}
      {!loading && authed && (
        <>
          {(!track || track.idle) ? (
            <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
              <div style={{width:'2.5rem',height:'2.5rem',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',color:'rgba(85,85,85,0.2)',fontSize:'0.9rem'}}>♪</div>
              <div>
                <div className="serif italic text-fg-secondary" style={{fontSize:'0.7rem'}}>Nada suena</div>
                <div className="mono text-muted uppercase" style={{fontSize:'0.5rem',letterSpacing:'1px'}}>Spotify</div>
              </div>
            </div>
          ) : (
            <>
              <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.375rem'}}>
                {track.cover
                  ? <img src={track.cover} alt="cover" style={{width:'2.5rem',height:'2.5rem',objectFit:'cover',border:'1px solid var(--border)'}} />
                  : <div style={{width:'2.5rem',height:'2.5rem',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',color:'rgba(85,85,85,0.2)'}}>♪</div>
                }
                <div style={{flex:1,minWidth:0}}>
                  <div className="serif italic text-fg-secondary" style={{fontSize:'0.7rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{track.title}</div>
                  <div className="mono text-muted" style={{fontSize:'0.5rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{track.artist}</div>
                </div>
                <span style={{fontSize:'0.6rem'}}>{track.playing ? '▶' : '⏸'}</span>
              </div>
              <div style={{height:'1px',background:'var(--border)',position:'relative',marginBottom:'0.5rem'}}>
                <div style={{height:'1px',background:'#1DB954',position:'absolute',top:0,left:0,width:`${pct}%`,transition:'width 1s linear'}} />
              </div>
              <MusicComment track={track} />
            </>
          )}
          <button onClick={logout} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted-dim)',fontFamily:'JetBrains Mono,monospace',fontSize:'0.4rem',marginTop:'0.375rem',letterSpacing:'1px',padding:0}}>desconectar</button>

  );
}

  const [notes, setNotes] = useState(()=>ls.get('astra_notes',[]));

  const save=()=>{
    if(!input.trim()||input.length>200) return;
    const nn=[{id:Date.now(),text:input.trim(),date:new Date().toISOString(),words:input.trim().split(/\s+/).length},...notes];
    if(nn.length>20) nn.pop();
    ls.set('astra_notes',nn); setNotes(nn); setInput('');
  };
  const del=id=>{const f=notes.filter(n=>n.id!==id);ls.set('astra_notes',f);setNotes(f);};
  const edit=id=>{const n=notes.find(n=>n.id===id);if(n){setInput(n.text);del(id);}};
  const wc=input.trim()?input.trim().split(/\s+/).length:0;
  return (
    <div style={{width:'100%'}}>
      <SectionLabel>Bloc de Notas Rápido</SectionLabel>
      <div style={{display:'flex',gap:'0.5rem',marginBottom:'0.5rem',alignItems:'flex-end'}}>
        <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();save();}}} placeholder="Escribe una nota rápida... (máx 200 caracteres)" className="astra-input astra-textarea" style={{flex:1,height:'4rem'}} />
        <AstraBtn onClick={save}>Guardar</AstraBtn>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.75rem'}}>
        <span className="mono text-muted-dim" style={{fontSize:'0.45rem'}}>{wc} palabras</span>
        <span className="mono text-muted-dim" style={{fontSize:'0.45rem'}}>{input.length}/200 caracteres</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:'0.5rem'}}>
        {notes.map(n=>(
          <div key={n.id} onClick={()=>edit(n.id)} className="note-card">
            <div className="serif text-fg-secondary" style={{fontSize:'0.65rem',marginBottom:'0.5rem',lineHeight:'1.5'}}>{n.text.substring(0,100)}{n.text.length>100?'...':''}</div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span className="mono text-muted-dim" style={{fontSize:'0.45rem'}}>{new Date(n.date).toLocaleDateString()}</span>
              <button onClick={e=>{e.stopPropagation();del(n.id);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',fontSize:'0.5rem'}}>✕</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TimeToolsTab() {
  const [tool, setTool] = useState('stopwatch');
  const [swTime, setSwTime] = useState(0);
  const [swRun, setSwRun] = useState(false);
  const [laps, setLaps] = useState([]);
  const swRef=useRef(null);
  useEffect(()=>{
    if(swRun){swRef.current=setInterval(()=>setSwTime(t=>t+1),100);}
    else if(swRef.current){clearInterval(swRef.current);}
    return()=>{if(swRef.current)clearInterval(swRef.current);};
  },[swRun]);
  const swDisp=`${String(Math.floor(swTime/600)).padStart(2,'0')}:${String(Math.floor((swTime%600)/10)).padStart(2,'0')}.${swTime%10}`;

  const [tMins, setTMins] = useState(5);
  const [tTime, setTTime] = useState(300);
  const [tRun, setTRun] = useState(false);
  const tRef=useRef(null);
  useEffect(()=>{
    if(tRun){tRef.current=setInterval(()=>setTTime(t=>{if(t<=1){setTRun(false);return 0;}return t-1;}),1000);}
    else if(tRef.current){clearInterval(tRef.current);}
    return()=>{if(tRef.current)clearInterval(tRef.current);};
  },[tRun]);
  const tDisp=`${String(Math.floor(tTime/60)).padStart(2,'0')}:${String(tTime%60).padStart(2,'0')}`;

  return (
    <div style={{width:'100%'}}>
      <SectionLabel>Herramientas de Tiempo</SectionLabel>
      <div className="tabs-row" style={{marginBottom:'1rem'}}>
        {[['stopwatch','Cronómetro'],['timer','Temporizador'],['alarm','Alarma']].map(([id,label])=>(
          <AstraBtn key={id} active={tool===id} onClick={()=>setTool(id)}>{label}</AstraBtn>
        ))}
      </div>
      {tool==='stopwatch' && (
        <div style={{textAlign:'center'}}>
          <div className="big-mono" style={{marginBottom:'0.75rem'}}>{swDisp}</div>
          <div style={{display:'flex',gap:'0.25rem',justifyContent:'center',flexWrap:'wrap'}}>
            <AstraBtn onClick={()=>setSwRun(true)}>Iniciar</AstraBtn>
            <AstraBtn onClick={()=>setSwRun(false)}>Pausa</AstraBtn>
            <AstraBtn onClick={()=>{setSwRun(false);setSwTime(0);setLaps([]);}}>Reiniciar</AstraBtn>
            <AstraBtn onClick={()=>setLaps(l=>[...l,swDisp])}>Vuelta</AstraBtn>
          </div>
          {laps.length>0 && <div style={{marginTop:'0.75rem'}}>{laps.map((l,i)=><div key={i} className="mono text-muted" style={{fontSize:'0.5rem'}}>Vuelta {i+1}: {l}</div>)}</div>}
        </div>
      )}
      {tool==='timer' && (
        <div style={{textAlign:'center'}}>
          <div className="big-mono" style={{marginBottom:'0.75rem'}}>{tDisp}</div>
          <div style={{display:'flex',gap:'0.25rem',justifyContent:'center',alignItems:'center',flexWrap:'wrap'}}>
            <input type="number" value={tMins} onChange={e=>setTMins(parseInt(e.target.value)||5)} min={1} max={60} className="astra-input" style={{width:'3.5rem',textAlign:'center'}} />
            <span className="mono text-muted" style={{fontSize:'0.5rem'}}>min</span>
            <AstraBtn onClick={()=>{setTTime(tMins*60);setTRun(true);}}>Iniciar</AstraBtn>
            <AstraBtn onClick={()=>setTRun(false)}>Pausa</AstraBtn>
            <AstraBtn onClick={()=>{setTRun(false);setTTime(tMins*60);}}>Reiniciar</AstraBtn>
          </div>
        </div>
      )}
      {tool==='alarm' && (
        <div style={{textAlign:'center'}}>
          <div className="big-mono" style={{marginBottom:'0.75rem'}}>--:-- --</div>
          <div style={{display:'flex',gap:'0.25rem',justifyContent:'center',alignItems:'center'}}>
            <input type="time" className="astra-input" style={{width:'8rem'}} />
            <AstraBtn>Activar</AstraBtn>
            <AstraBtn>Detener</AstraBtn>
          </div>
        </div>
      )}
    </div>
  );
}

function SearchHub() {

    'annas-archive.org'
  ];

  const annaSearch = (e) => {

    const mirror = ANNA_MIRRORS[Math.floor(Math.random() * ANNA_MIRRORS.length)];

  return (
    <div style={{width:'100%',maxWidth:'600px',margin:'0 auto'}}>
      <SectionLabel>Búsquedas</SectionLabel>
      <div style={{display:'flex',gap:'0.75rem',flexWrap:'wrap',justifyContent:'center'}}>

  );
}

const PROTOCOLO_LINKS = [

function BackupNotice({ msg, onClose }) {
  useEffect(()=>{ const id=setTimeout(onClose, 3000); return()=>clearTimeout(id); },[]);
  return (
    <div style={{position:'fixed',bottom:'3rem',right:'1rem',border:'1px solid var(--primary)',background:'var(--card)',padding:'0.5rem 1rem',fontFamily:'JetBrains Mono,monospace',fontSize:'0.55rem',color:'var(--foreground)',zIndex:100,animation:'fadeIn 0.3s ease both'}}>
      {msg}
    </div>
  );
}

function Footer({ onPublicChange }) {
  const [lastBackup, setLastBackup] = useState(()=>ls.get('last_backup',null));
  const [notice, setNotice] = useState(null);
  const [publicMode, setPublicMode] = useState(()=>ls.get('public_mode',false));
  const [showProtocolo, setShowProtocolo] = useState(false);


    const backup = async () => {
    // Primero, el backup local (descarga de archivo)
    try {
      const snapshot = {};
      const keys = ['astra_notes','diario_data','contexto_events','tracker_data','pomodoroCount','pomodoroHistory','gcal_url','public_mode'];
      keys.forEach(k => { const v = localStorage.getItem(k); if(v) snapshot[k] = v; });
      const json = JSON.stringify(snapshot, null, 2);
      const blob = new Blob([json], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'astra-backup-' + new Date().toISOString().split('T')[0] + '.json';
      a.click();
      URL.revokeObjectURL(url);
      const now = new Date().toLocaleString('es-CO');
      ls.set('last_backup', now);
      setLastBackup(now);
      setNotice('✓ Backup local descargado');
    } catch(e) {
      setNotice('✗ Error en backup local: ' + e.message);
    }

    // Luego, backup al servidor
    const res = await createBackup('manual');
    if (res.ok) {
      setNotice(res.msg);
    } else {
      setNotice(res.msg);
    }
  };

  const togglePublic = () => {
    const next = !publicMode;
    ls.set('public_mode', next);
    setPublicMode(next);
    if(onPublicChange) onPublicChange(next);
    setNotice(next ? '⊙ Modo Público activado' : '⊙ Modo Público desactivado');
  };
  useEffect(() => {
    checkAndRunAutoBackup();
    const interval = setInterval(checkAndRunAutoBackup, 3600000); // cada hora
    return () => clearInterval(interval);
  }, []);
  return (
    <>
      {notice && <BackupNotice msg={notice} onClose={()=>setNotice(null)} />}
      <footer>
        <div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap',alignItems:'center'}}>
          <AstraBtn onClick={togglePublic} active={publicMode} style={{fontSize:'0.4rem',letterSpacing:'1px'}}>
            {publicMode ? '⊙ Público' : 'Modo Público'}
          </AstraBtn>
          <AstraBtn onClick={()=>{
            ['https://tasks.google.com','https://gemini.google.com','https://claude.ai','https://lcf.phidias.co'].forEach(u=>window.open(u,'_blank'));
          }} style={{fontSize:'0.4rem',letterSpacing:'1px',borderColor:'var(--primary)'}}>Protocolo</AstraBtn>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
          <span className='mono text-muted-dim' style={{fontSize:'0.45rem'}}>📦 Último backup: {lastBackup||'Nunca'}</span>
          <AstraBtn onClick={backup} style={{fontSize:'0.45rem'}}>Backup ahora</AstraBtn>
        </div>
      </footer>
    </>
  );
}
